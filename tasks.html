<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — Planova Admin</title>
  <meta name="description" content="Cross-team task oversight, workload balancing, and admin governance for Planova campus club events.">
  <link rel="icon" type="image/jpeg" href="planova-logo.jpg">
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: '#4F46E5',
            ai: '#0E7490',
            'status-todo': '#94A3B8',
            'status-doing': '#2563EB',
            'status-blocked': '#DC2626',
            'status-review': '#D97706',
            'status-done': '#059669',
          }
        }
      }
    }
  </script>
  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F8FAFC;
      color: #0F1729;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .clean-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      transition: box-shadow 150ms ease, border-color 150ms ease;
    }
    .clean-card:hover {
      border-color: #CBD5E1;
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06);
    }
    .btn-black {
      background-color: #000000;
      color: #FFFFFF;
      transition: background-color 150ms ease;
    }
    .btn-black:hover {
      background-color: #1E293B;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const INITIAL_TASKS = [
      { id: 'tsk-101', title: 'Confirm Main Auditorium acoustic testing & sound check', vertical: 'Logistics', owner: 'Priya Patel', ownerAvatar: 'PP', priority: 'critical', status: 'blocked', dueDate: '2026-09-18', overdue: true, aiCreated: false },
      { id: 'tsk-102', title: 'Finalize Title & Gold Sponsor Tier agreement contracts', vertical: 'Sponsorship', owner: 'Dev Malik', ownerAvatar: 'DM', priority: 'high', status: 'review', dueDate: '2026-09-20', overdue: false, aiCreated: true },
      { id: 'tsk-103', title: 'Submit Campus Safety & EMT coverage documentation', vertical: 'Logistics', owner: 'Tanvi Gaikwad', ownerAvatar: 'TG', priority: 'high', status: 'doing', dueDate: '2026-09-19', overdue: true, aiCreated: false },
      { id: 'tsk-104', title: 'Deploy Hackathon portal live registration & RSVP dashboard', vertical: 'Technical', owner: 'Arjun Rao', ownerAvatar: 'AR', priority: 'high', status: 'done', dueDate: '2026-09-15', overdue: false, aiCreated: true },
      { id: 'tsk-105', title: 'Draft opening keynote speaker itinerary & green-room logistics', vertical: 'Technical', owner: 'Kavya Sen', ownerAvatar: 'KS', priority: 'medium', status: 'doing', dueDate: '2026-09-22', overdue: false, aiCreated: false },
      { id: 'tsk-106', title: 'Print campus signage banners and stage sponsor backdrops', vertical: 'Marketing', owner: 'Neha Sharma', ownerAvatar: 'NS', priority: 'medium', status: 'to_do', dueDate: '2026-09-25', overdue: false, aiCreated: false },
      { id: 'tsk-107', title: 'Order badges, lanyard tags, and volunteer t-shirts', vertical: 'Operations', owner: 'Rohan Jha', ownerAvatar: 'RJ', priority: 'low', status: 'to_do', dueDate: '2026-09-26', overdue: false, aiCreated: true },
      { id: 'tsk-108', title: 'Resolve power strip & high-amp breaker allocation for 60 teams', vertical: 'Logistics', owner: 'Priya Patel', ownerAvatar: 'PP', priority: 'critical', status: 'doing', dueDate: '2026-09-19', overdue: true, aiCreated: true },
      { id: 'tsk-109', title: 'Coordinate catering food delivery & dietary wristband tagging', vertical: 'Operations', owner: 'Tanvi Gaikwad', ownerAvatar: 'TG', priority: 'medium', status: 'to_do', dueDate: '2026-09-27', overdue: false, aiCreated: false },
      { id: 'tsk-110', title: 'Publish Instagram countdown teaser & hacker spotlight reels', vertical: 'Marketing', owner: 'Neha Sharma', ownerAvatar: 'NS', priority: 'low', status: 'done', dueDate: '2026-09-16', overdue: false, aiCreated: false },
      { id: 'tsk-111', title: 'Configure judging portal scoring rubric & API benchmark webhooks', vertical: 'Technical', owner: 'Arjun Rao', ownerAvatar: 'AR', priority: 'high', status: 'doing', dueDate: '2026-09-23', overdue: false, aiCreated: true },
      { id: 'tsk-112', title: 'Collect guest judge travel receipts & parking permit clearances', vertical: 'Sponsorship', owner: 'Dev Malik', ownerAvatar: 'DM', priority: 'low', status: 'to_do', dueDate: '2026-09-17', overdue: true, aiCreated: false }
    ];

    const MEMBERS = [
      { name: 'Priya Patel', avatar: 'PP', vertical: 'Logistics' },
      { name: 'Arjun Rao', avatar: 'AR', vertical: 'Technical' },
      { name: 'Neha Sharma', avatar: 'NS', vertical: 'Marketing' },
      { name: 'Dev Malik', avatar: 'DM', vertical: 'Sponsorship' },
      { name: 'Rohan Jha', avatar: 'RJ', vertical: 'Operations' },
      { name: 'Tanvi Gaikwad', avatar: 'TG', vertical: 'Logistics' },
      { name: 'Kavya Sen', avatar: 'KS', vertical: 'Technical' }
    ];

    const NAV_ITEMS = [
      { name: 'Dashboard', path: 'dashboard.html', icon: '📊', badge: 'Home' },
      { name: 'Tasks', path: 'tasks.html', icon: '📋', active: true, badge: '68 Total' },
      { name: 'Volunteers', path: 'volunteers.html', icon: '👥', badge: '22 Members' },
      { name: 'Meetings', path: 'meetings.html', icon: '🎙️', badge: '9 Meetings' },
      { name: 'Deadlines', path: 'deadlines.html', icon: '⏰', badge: '5 This Week' },
      { name: 'Document Review', path: 'documents-review.html', icon: '📄', badge: '2 Pending' },
      { name: 'Risks', path: 'risks.html', icon: '⚠️', badge: '1 Critical' },
      { name: 'Announcements', path: 'announcements.html', icon: '📢', badge: '12 Sent' },
      { name: 'Knowledge Base', path: 'knowledge.html', icon: '🧠', badge: '24 Docs' }
    ];

    const COLUMNS = [
      { id: 'to_do', label: 'To do', color: '#94A3B8', bg: 'bg-slate-100 text-slate-700' },
      { id: 'doing', label: 'Doing', color: '#2563EB', bg: 'bg-blue-50 text-blue-700' },
      { id: 'blocked', label: 'Blocked', color: '#DC2626', bg: 'bg-red-50 text-red-700' },
      { id: 'review', label: 'Review', color: '#D97706', bg: 'bg-amber-50 text-amber-700' },
      { id: 'done', label: 'Done', color: '#059669', bg: 'bg-emerald-50 text-emerald-700' }
    ];

    const PRIORITY_BADGES = {
      low: { label: 'Low', color: '#64748B', bg: 'bg-slate-100 text-slate-600' },
      medium: { label: 'Medium', color: '#D97706', bg: 'bg-amber-100 text-amber-800' },
      high: { label: 'High', color: '#EA580C', bg: 'bg-orange-100 text-orange-800' },
      critical: { label: 'Critical', color: '#B91C1C', bg: 'bg-red-100 text-red-800' }
    };

    const formatDate = (d) => {
      if (!d) return '';
      const parts = d.split('-');
      if (parts.length === 3) {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const m = parseInt(parts[1], 10) - 1;
        const day = parseInt(parts[2], 10);
        return `${months[m] || parts[1]} ${day}`;
      }
      return d;
    };

    function TasksApp() {
      const isAdmin = true;
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [loading, setLoading] = useState(true);

      // Data state
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [view, setView] = useState('board'); // 'board' | 'list' | 'timeline'

      // Filters
      const [selectedVertical, setSelectedVertical] = useState('all');
      const [selectedOwner, setSelectedOwner] = useState('all');
      const [selectedPriority, setSelectedPriority] = useState('all');
      const [selectedStatus, setSelectedStatus] = useState('all');
      const [overdueOnly, setOverdueOnly] = useState(false);

      // Bulk Selection
      const [selectedTaskIds, setSelectedTaskIds] = useState(new Set());

      // Modals
      const [bulkReassignModal, setBulkReassignModal] = useState(false);
      const [bulkDeadlineModal, setBulkDeadlineModal] = useState(false);
      const [reassignTargetOwner, setReassignTargetOwner] = useState(MEMBERS[0].name);
      const [bulkTargetDeadline, setBulkTargetDeadline] = useState('2026-09-24');

      // Dropout Modal
      const [dropoutModal, setDropoutModal] = useState(false);
      const [dropoutFrom, setDropoutFrom] = useState(MEMBERS[0].name);
      const [dropoutTo, setDropoutTo] = useState(MEMBERS[1].name);

      // Override / Force Close Modal
      const [overrideModal, setOverrideModal] = useState(false);
      const [overrideTask, setOverrideTask] = useState(null);
      const [overrideNote, setOverrideNote] = useState('');

      // Toast
      const [toast, setToast] = useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // Loading simulator
      useEffect(() => {
        const timer = setTimeout(() => setLoading(false), 400);
        return () => clearTimeout(timer);
      }, []);

      // Filtered Tasks (AND logic)
      const filteredTasks = useMemo(() => {
        return tasks.filter(t => {
          if (selectedVertical !== 'all' && t.vertical !== selectedVertical) return false;
          if (selectedOwner !== 'all' && t.owner !== selectedOwner) return false;
          if (selectedPriority !== 'all' && t.priority !== selectedPriority) return false;
          if (selectedStatus !== 'all' && t.status !== selectedStatus) return false;
          if (overdueOnly && !t.overdue) return false;
          return true;
        });
      }, [tasks, selectedVertical, selectedOwner, selectedPriority, selectedStatus, overdueOnly]);

      const overdueCount = useMemo(() => tasks.filter(t => t.overdue && t.status !== 'done').length, [tasks]);

      const toggleSelect = (id) => {
        setSelectedTaskIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      const selectAllVisible = () => {
        if (selectedTaskIds.size === filteredTasks.length) {
          setSelectedTaskIds(new Set());
        } else {
          setSelectedTaskIds(new Set(filteredTasks.map(t => t.id)));
        }
      };

      const handleBulkReassign = () => {
        if (!selectedTaskIds.size) return;
        const targetObj = MEMBERS.find(m => m.name === reassignTargetOwner);
        setTasks(prev => prev.map(t => {
          if (selectedTaskIds.has(t.id)) {
            return { ...t, owner: targetObj.name, ownerAvatar: targetObj.avatar };
          }
          return t;
        }));
        showToast(`Reassigned ${selectedTaskIds.size} tasks to ${reassignTargetOwner}.`);
        setSelectedTaskIds(new Set());
        setBulkReassignModal(false);
      };

      const handleBulkDeadline = () => {
        if (!selectedTaskIds.size) return;
        setTasks(prev => prev.map(t => {
          if (selectedTaskIds.has(t.id)) {
            return { ...t, dueDate: bulkTargetDeadline, overdue: new Date(bulkTargetDeadline) < new Date('2026-09-19') };
          }
          return t;
        }));
        showToast(`Updated deadline for ${selectedTaskIds.size} tasks to ${bulkTargetDeadline}.`);
        setSelectedTaskIds(new Set());
        setBulkDeadlineModal(false);
      };

      const handleDropoutReassign = () => {
        const count = tasks.filter(t => t.owner === dropoutFrom && t.status !== 'done').length;
        if (count === 0) {
          showToast(`No open tasks found for ${dropoutFrom}.`);
          setDropoutModal(false);
          return;
        }
        const targetObj = MEMBERS.find(m => m.name === dropoutTo);
        setTasks(prev => prev.map(t => {
          if (t.owner === dropoutFrom && t.status !== 'done') {
            return { ...t, owner: targetObj.name, ownerAvatar: targetObj.avatar };
          }
          return t;
        }));
        showToast(`Transferred ${count} open tasks from ${dropoutFrom} to ${dropoutTo}.`);
        setDropoutModal(false);
      };

      const handleOverrideClose = () => {
        if (!overrideTask || !overrideNote.trim()) return;
        setTasks(prev => prev.map(t => {
          if (t.id === overrideTask.id) {
            return { ...t, status: 'done', overdue: false, overrideNote: overrideNote.trim(), closedByAdmin: true };
          }
          return t;
        }));
        showToast(`Task overridden & closed by President. Logged audit note.`);
        setOverrideModal(false);
        setOverrideTask(null);
        setOverrideNote('');
      };

      return (
        <div className="min-h-screen bg-[#F8FAFC]">
          {/* Top Bar */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-[#E2E8F0] px-4 sm:px-8 py-3 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-3 sm:gap-4">
              <button
                onClick={() => setSidebarOpen(true)}
                className="p-2 -ml-1 text-slate-700 hover:text-black hover:bg-slate-100 rounded-xl transition-colors flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-black"
                title="Open Navigation Menu"
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <span className="hidden md:inline text-xs font-bold text-slate-800">Modules</span>
              </button>

              <a href="dashboard.html" className="flex items-center gap-3 group">
                <div className="w-10 h-10 rounded-xl bg-white border border-[#E2E8F0] shadow-xs flex items-center justify-center p-1 flex-shrink-0">
                  <img src="planova-logo.jpg" alt="Logo" className="w-full h-full object-contain" onError={e => { e.target.style.display='none'; e.target.parentElement.innerHTML='<span class="font-black text-black">P</span>'; }} />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xl font-black tracking-tight text-black leading-none">PLANOVA</span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-black border border-slate-300">
                      TechNova 2026
                    </span>
                  </div>
                  <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block mt-0.5">
                    Tasks Governance
                  </span>
                </div>
              </a>
            </div>

            <div className="flex items-center gap-3">
              <a
                href="dashboard.html"
                className="hidden sm:inline-flex items-center gap-1.5 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl transition-colors border border-slate-200"
              >
                ← Dashboard
              </a>

              {/* Profile with President Role */}
              <div className="flex items-center gap-2.5 pl-3 border-l border-slate-200">
                <div className="relative flex-shrink-0">
                  <div className="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center shadow-xs">
                    J
                  </div>
                  <span className="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white" title="Online"></span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-extrabold text-black leading-tight">Jenish</span>
                  <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-black tracking-wide uppercase bg-black text-white shadow-xs">
                    President
                  </span>
                </div>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-6">
            {/* Breadcrumb */}
            <nav className="flex items-center gap-2 text-xs font-semibold text-slate-500">
              <a href="dashboard.html" className="hover:text-black transition-colors">Dashboard</a>
              <span>/</span>
              <span className="text-black font-bold">Tasks</span>
            </nav>

            {/* PAGE HEADER PATTERN: [Bold page title] [light-gray count/status pill] + subtitle */}
            <div className="clean-card p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-3">
                  <h1 className="text-2xl sm:text-3xl font-black text-[#0F1729] tracking-tight">
                    Tasks
                  </h1>
                  <span className="text-xs font-bold px-3 py-1 rounded-full bg-slate-100 text-slate-800 border border-slate-200">
                    68 total
                  </span>
                </div>
                <p className="text-xs sm:text-sm text-slate-500 mt-1">
                  Every task across all verticals with administrative oversight and reassignment controls.
                </p>
              </div>

              {/* Admin-only Dropout Reassign Button */}
              {isAdmin && (
                <div className="flex items-center gap-2.5">
                  <button
                    onClick={() => setDropoutModal(true)}
                    className="flex items-center gap-2 px-3.5 py-2 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 rounded-xl border border-slate-300 transition-colors"
                  >
                    <span>🔄 Member Dropped Out?</span>
                  </button>
                </div>
              )}
            </div>

            {/* FILTER BAR & VIEW TOGGLE */}
            <div className="clean-card p-4 space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-3">
                {/* Filters */}
                <div className="flex flex-wrap items-center gap-2.5 text-xs">
                  {/* Pinned Overdue Chip */}
                  <button
                    onClick={() => setOverdueOnly(!overdueOnly)}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold border transition-all ${
                      overdueOnly
                        ? 'bg-red-600 text-white border-red-600 shadow-xs'
                        : 'bg-red-50 text-red-700 border-red-200 hover:bg-red-100'
                    }`}
                  >
                    <span className="w-2 h-2 rounded-full bg-red-500"></span>
                    <span>Overdue ({overdueCount})</span>
                  </button>

                  {/* Vertical Filter */}
                  <div className="flex items-center gap-1">
                    <span className="text-slate-400 font-medium">Vertical:</span>
                    <select
                      value={selectedVertical}
                      onChange={e => setSelectedVertical(e.target.value)}
                      className="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-slate-800 font-semibold focus:outline-none focus:ring-1 focus:ring-black cursor-pointer"
                    >
                      <option value="all">All Verticals</option>
                      <option value="Logistics">Logistics</option>
                      <option value="Marketing">Marketing</option>
                      <option value="Technical">Technical</option>
                      <option value="Sponsorship">Sponsorship</option>
                      <option value="Operations">Operations</option>
                    </select>
                  </div>

                  {/* Owner Filter */}
                  <div className="flex items-center gap-1">
                    <span className="text-slate-400 font-medium">Owner:</span>
                    <select
                      value={selectedOwner}
                      onChange={e => setSelectedOwner(e.target.value)}
                      className="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-slate-800 font-semibold focus:outline-none focus:ring-1 focus:ring-black cursor-pointer"
                    >
                      <option value="all">All Owners</option>
                      {MEMBERS.map(m => (
                        <option key={m.name} value={m.name}>{m.name}</option>
                      ))}
                    </select>
                  </div>

                  {/* Priority Filter */}
                  <div className="flex items-center gap-1">
                    <span className="text-slate-400 font-medium">Priority:</span>
                    <select
                      value={selectedPriority}
                      onChange={e => setSelectedPriority(e.target.value)}
                      className="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-slate-800 font-semibold focus:outline-none focus:ring-1 focus:ring-black cursor-pointer"
                    >
                      <option value="all">All Priorities</option>
                      <option value="low">Low</option>
                      <option value="medium">Medium</option>
                      <option value="high">High</option>
                      <option value="critical">Critical</option>
                    </select>
                  </div>

                  {/* Status Filter */}
                  <div className="flex items-center gap-1">
                    <span className="text-slate-400 font-medium">Status:</span>
                    <select
                      value={selectedStatus}
                      onChange={e => setSelectedStatus(e.target.value)}
                      className="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-slate-800 font-semibold focus:outline-none focus:ring-1 focus:ring-black cursor-pointer"
                    >
                      <option value="all">All Statuses</option>
                      {COLUMNS.map(c => (
                        <option key={c.id} value={c.id}>{c.label}</option>
                      ))}
                    </select>
                  </div>

                  {(selectedVertical !== 'all' || selectedOwner !== 'all' || selectedPriority !== 'all' || selectedStatus !== 'all' || overdueOnly) && (
                    <button
                      onClick={() => {
                        setSelectedVertical('all');
                        setSelectedOwner('all');
                        setSelectedPriority('all');
                        setSelectedStatus('all');
                        setOverdueOnly(false);
                      }}
                      className="text-xs font-bold text-slate-500 hover:text-black underline ml-1"
                    >
                      Reset filters
                    </button>
                  )}
                </div>

                {/* View Mode Toggle */}
                <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs">
                  <button
                    onClick={() => setView('board')}
                    className={`px-3 py-1 rounded-lg font-bold transition-all ${
                      view === 'board' ? 'bg-black text-white shadow-xs' : 'text-slate-600 hover:text-black'
                    }`}
                  >
                    Board
                  </button>
                  <button
                    onClick={() => setView('list')}
                    className={`px-3 py-1 rounded-lg font-bold transition-all ${
                      view === 'list' ? 'bg-black text-white shadow-xs' : 'text-slate-600 hover:text-black'
                    }`}
                  >
                    List
                  </button>
                  <button
                    onClick={() => setView('timeline')}
                    className={`px-3 py-1 rounded-lg font-bold transition-all ${
                      view === 'timeline' ? 'bg-black text-white shadow-xs' : 'text-slate-600 hover:text-black'
                    }`}
                  >
                    Timeline
                  </button>
                </div>
              </div>

              {/* Admin Bulk Actions Banner */}
              {isAdmin && selectedTaskIds.size > 0 && (
                <div className="bg-slate-900 text-white rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 text-xs shadow-md">
                  <div className="flex items-center gap-2">
                    <span className="bg-brand text-white px-2 py-0.5 rounded font-black text-[10px]">
                      {selectedTaskIds.size} SELECTED
                    </span>
                    <span className="text-slate-300">Choose an administrative action:</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setBulkReassignModal(true)}
                      className="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-white rounded-lg font-bold transition-colors"
                    >
                      Bulk Reassign Owner
                    </button>

                  <div className="p-4 border-t border-[#E2E8F0] bg-[#F8FAFC] flex items-center justify-between">

                      <div className="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center">
                        J
                      </div>
                      <div>
                        <p className="text-xs font-bold text-black leading-tight">Jenish</p>
                        <p className="text-[10px] font-extrabold text-slate-500 uppercase">{isAdmin ? 'President (Admin)' : 'Member'}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2 animate-bounce border border-slate-700">
              <span className="text-emerald-400">✓</span>
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<TasksApp />, document.getElementById('root'));
  </script>
</body>
</html>
