<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteers — Planova Admin</title>
  <meta name="description" content="Full roster management, workload balancing, and volunteer availability for Planova campus club events.">
  <link rel="icon" type="image/jpeg" href="planova-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: '#4F46E5',
            ai: '#0E7490',
            'status-todo': '#94A3B8',
            'status-doing': '#2563EB',
            'status-blocked': '#DC2626',
            'status-review': '#D97706',
            'status-done': '#059669',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F8FAFC;
      color: #0F1729;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .clean-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      transition: box-shadow 150ms ease, border-color 150ms ease;
    }
    .clean-card:hover {
      border-color: #CBD5E1;
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06);
    }
    .btn-black {
      background-color: #000000;
      color: #FFFFFF;
      transition: background-color 150ms ease;
    }
    .btn-black:hover {
      background-color: #1E293B;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const INITIAL_MEMBERS = [
      { id: 'usr-1', name: 'Priya Patel', avatar: 'PP', email: 'priya.p@campus.edu', role: 'Core Team', vertical: 'Logistics', skills: ['Floor Management', 'Audio Testing', 'Vendor Liaison'], openTasks: 8, availability: [1, 1, 1, 0, 1, 1, 0] },
      { id: 'usr-2', name: 'Arjun Rao', avatar: 'AR', email: 'arjun.r@campus.edu', role: 'Core Team', vertical: 'Technical', skills: ['React', 'PostgreSQL', 'APIs', 'DevOps'], openTasks: 7, availability: [1, 1, 0, 1, 1, 1, 1] },
      { id: 'usr-3', name: 'Neha Sharma', avatar: 'NS', email: 'neha.s@campus.edu', role: 'Core Team', vertical: 'Marketing', skills: ['Canva', 'Figma', 'Copywriting', 'Reels'], openTasks: 4, availability: [1, 1, 1, 1, 1, 0, 0] },
      { id: 'usr-4', name: 'Dev Malik', avatar: 'DM', email: 'dev.m@campus.edu', role: 'Core Team', vertical: 'Sponsorship', skills: ['Pitch Decks', 'Contract Negotiation', 'Sponsor CRM'], openTasks: 5, availability: [1, 0, 1, 1, 0, 1, 0] },
      { id: 'usr-5', name: 'Rohan Jha', avatar: 'RJ', email: 'rohan.j@campus.edu', role: 'Volunteer', vertical: 'Operations', skills: ['Badges', 'Kit Assembly', 'Logistics'], openTasks: 3, availability: [1, 1, 1, 1, 1, 1, 0] },
      { id: 'usr-6', name: 'Tanvi Gaikwad', avatar: 'TG', email: 'tanvi.g@campus.edu', role: 'Volunteer', vertical: 'Logistics', skills: ['Safety & EMT', 'Crowd Protocol', 'First Aid'], openTasks: 4, availability: [0, 1, 1, 1, 1, 0, 0] },
      { id: 'usr-7', name: 'Kavya Sen', avatar: 'KS', email: 'kavya.s@campus.edu', role: 'Core Team', vertical: 'Technical', skills: ['Judge Rubrics', 'Speaker Logistics', 'Hardware'], openTasks: 3, availability: [1, 1, 1, 0, 1, 1, 1] },
      { id: 'usr-8', name: 'Aman Varma', avatar: 'AV', email: 'aman.v@campus.edu', role: 'Volunteer', vertical: 'Operations', skills: ['Check-in Booth', 'Badge Verification'], openTasks: 0, availability: [1, 1, 1, 1, 1, 1, 1] },
      { id: 'usr-9', name: 'Sneha Kulkarni', avatar: 'SK', email: 'sneha.k@campus.edu', role: 'Volunteer', vertical: 'Marketing', skills: ['Photography', 'Social Stories'], openTasks: 0, availability: [1, 1, 0, 0, 1, 1, 0] },
      { id: 'usr-10', name: 'Vikram Joshi', avatar: 'VJ', email: 'vikram.j@campus.edu', role: 'Volunteer', vertical: 'Technical', skills: ['Network Cabling', 'Wi-Fi Setup'], openTasks: 0, availability: [0, 1, 1, 1, 1, 0, 1] }
    ];

    const NAV_ITEMS = [
      { name: 'Dashboard', path: 'dashboard.html', icon: '📊', badge: 'Home' },
      { name: 'Tasks', path: 'tasks.html', icon: '📋', badge: '68 Total' },
      { name: 'Volunteers', path: 'volunteers.html', icon: '👥', active: true, badge: '22 Members' },
      { name: 'Meetings', path: 'meetings.html', icon: '🎙️', badge: '9 Meetings' },
      { name: 'Deadlines', path: 'deadlines.html', icon: '⏰', badge: '5 This Week' },
      { name: 'Document Review', path: 'documents-review.html', icon: '📄', badge: '2 Pending' },
      { name: 'Risks', path: 'risks.html', icon: '⚠️', badge: '1 Critical' },
      { name: 'Announcements', path: 'announcements.html', icon: '📢', badge: '12 Sent' },
      { name: 'Knowledge Base', path: 'knowledge.html', icon: '🧠', badge: '24 Docs' }
    ];

    const DAYS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

    function VolunteersApp() {
      const isAdmin = true;
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [loading, setLoading] = useState(true);

      const [members, setMembers] = useState(INITIAL_MEMBERS);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedVertical, setSelectedVertical] = useState('all');

      // Modals
      const [rebalanceModal, setRebalanceModal] = useState(false);
      const [inviteModal, setInviteModal] = useState(false);
      const [reassignVerticalModal, setReassignVerticalModal] = useState(false);
      const [targetMember, setTargetMember] = useState(null);
      const [newVertical, setNewVertical] = useState('Logistics');
      const [removeConfirmModal, setRemoveConfirmModal] = useState(false);
      const [messageModal, setMessageModal] = useState(false);
      const [msgContent, setMsgContent] = useState('');

      // New Invite form state
      const [inviteEmail, setInviteEmail] = useState('');
      const [inviteRole, setInviteRole] = useState('Volunteer');
      const [inviteVertical, setInviteVertical] = useState('Operations');
      const [generatedLink, setGeneratedLink] = useState('');

      // Toast
      const [toast, setToast] = useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        const timer = setTimeout(() => setLoading(false), 400);
        return () => clearTimeout(timer);
      }, []);

      // Metrics
      const totalMembers = 22; // display total
      const activeCount = members.length;
      const overloadedCount = useMemo(() => members.filter(m => m.openTasks > 6).length, [members]);
      const freeCount = useMemo(() => members.filter(m => m.openTasks === 0).length, [members]);
      const avgLoad = useMemo(() => {
        const sum = members.reduce((acc, m) => acc + m.openTasks, 0);
        return (sum / members.length).toFixed(1);
      }, [members]);

      // Filtered Members
      const filteredMembers = useMemo(() => {
        return members.filter(m => {
          if (selectedVertical !== 'all' && m.vertical !== selectedVertical) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchName = m.name.toLowerCase().includes(q);
            const matchSkills = m.skills.some(s => s.toLowerCase().includes(q));
            if (!matchName && !matchSkills) return false;
          }
          return true;
        });
      }, [members, selectedVertical, searchQuery]);

      // AI Rebalance Suggestions
      const rebalanceSuggestions = useMemo(() => {
        const overloaded = members.filter(m => m.openTasks > 6);
        const free = members.filter(m => m.openTasks === 0);
        const suggestions = [];
        if (overloaded.length > 0 && free.length > 0) {
          suggestions.push({
            id: 'sug-1',
            from: 'Priya Patel (8 tasks)',
            to: 'Aman Varma (0 tasks)',
            task: 'Auditorium cable run checks',
            reason: 'Aman is in Operations with 100% Mon-Fri availability.'
          });
          suggestions.push({
            id: 'sug-2',
            from: 'Arjun Rao (7 tasks)',
            to: 'Vikram Joshi (0 tasks)',
            task: 'Stage router Wi-Fi bandwidth configuration',
            reason: 'Vikram has Network Cabling skills and zero active tasks.'
          });
        }
        return suggestions;
      }, [members]);

      const handleApplyRebalance = () => {
        setMembers(prev => prev.map(m => {
          if (m.name === 'Priya Patel') return { ...m, openTasks: m.openTasks - 1 };
          if (m.name === 'Aman Varma') return { ...m, openTasks: m.openTasks + 1 };
          if (m.name === 'Arjun Rao') return { ...m, openTasks: m.openTasks - 1 };
          if (m.name === 'Vikram Joshi') return { ...m, openTasks: m.openTasks + 1 };
          return m;
        }));
        showToast('AI Workload rebalancing applied successfully! Tasks redistributed.');
        setRebalanceModal(false);
      };

      const handleRoleChange = (memberId, newRole) => {
        setMembers(prev => prev.map(m => m.id === memberId ? { ...m, role: newRole } : m));
        showToast(`Role updated to ${newRole}.`);
      };

      const handleSendInvite = (e) => {
        e.preventDefault();
        if (!inviteEmail.trim()) return;
        const namePart = inviteEmail.split('@')[0].replace('.', ' ');
        const capName = namePart.charAt(0).toUpperCase() + namePart.slice(1);
        const initials = namePart.split(' ').map(s => s[0]?.toUpperCase()).join('').slice(0, 2) || 'NW';
        const newM = {
          id: `usr-${Date.now()}`,
          name: capName,
          avatar: initials,
          email: inviteEmail.trim(),
          role: inviteRole,
          vertical: inviteVertical,
          skills: ['General Event Ops'],
          openTasks: 0,
          availability: [1, 1, 1, 1, 1, 0, 0]
        };
        setMembers(prev => [newM, ...prev]);
        setGeneratedLink(`https://planova.campus.edu/join?invite=tk_${Date.now().toString(36)}`);
        showToast(`Invitation sent to ${inviteEmail}!`);
      };

      const handleConfirmRemove = () => {
        if (!targetMember) return;
        setMembers(prev => prev.filter(m => m.id !== targetMember.id));
        showToast(`Removed ${targetMember.name} from event roster.`);
        setRemoveConfirmModal(false);
        setTargetMember(null);
      };

      const handleConfirmReassignVertical = () => {
        if (!targetMember) return;
        setMembers(prev => prev.map(m => m.id === targetMember.id ? { ...m, vertical: newVertical } : m));
        showToast(`Reassigned ${targetMember.name} to ${newVertical}.`);
        setReassignVerticalModal(false);
        setTargetMember(null);
      };

      return (
        <div className="min-h-screen bg-[#F8FAFC]">
          {/* Header */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-[#E2E8F0] px-4 sm:px-8 py-3 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-3 sm:gap-4">
              <button
                onClick={() => setSidebarOpen(true)}
                className="p-2 -ml-1 text-slate-700 hover:text-black hover:bg-slate-100 rounded-xl transition-colors flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-black"
                title="Open Navigation Menu"
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <span className="hidden md:inline text-xs font-bold text-slate-800">Modules</span>
              </button>

              <a href="dashboard.html" className="flex items-center gap-3 group">
                <div className="w-10 h-10 rounded-xl bg-white border border-[#E2E8F0] shadow-xs flex items-center justify-center p-1 flex-shrink-0">
                  <img src="planova-logo.jpg" alt="Logo" className="w-full h-full object-contain" onError={e => { e.target.style.display='none'; e.target.parentElement.innerHTML='<span class="font-black text-black">P</span>'; }} />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xl font-black tracking-tight text-black leading-none">PLANOVA</span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-black border border-slate-300">
                      TechNova 2026
                    </span>
                  </div>
                  <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block mt-0.5">
                    Volunteers Governance
                  </span>
                </div>
              </a>
            </div>

            <div className="flex items-center gap-3">
              <a
                href="dashboard.html"
                className="hidden sm:inline-flex items-center gap-1.5 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl transition-colors border border-slate-200"
              >
                ← Dashboard
              </a>

              {/* Profile with President Role */}
              <div className="flex items-center gap-2.5 pl-3 border-l border-slate-200">
                <div className="relative flex-shrink-0">
                  <div className="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center shadow-xs">
                    J
                  </div>
                  <span className="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white" title="Online"></span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-extrabold text-black leading-tight">Jenish</span>
                  <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-black tracking-wide uppercase bg-black text-white shadow-xs">
                    President
                  </span>
                </div>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-6">
            {/* Breadcrumb */}
            <nav className="flex items-center gap-2 text-xs font-semibold text-slate-500">
              <a href="dashboard.html" className="hover:text-black transition-colors">Dashboard</a>
              <span>/</span>
              <span className="text-black font-bold">Volunteers</span>
            </nav>

            {/* PAGE HEADER PATTERN: [Bold page title] [light-gray count/status pill] + subtitle */}
            <div className="clean-card p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-3">
                  <h1 className="text-2xl sm:text-3xl font-black text-[#0F1729] tracking-tight">
                    Volunteers
                  </h1>
                  <span className="text-xs font-bold px-3 py-1 rounded-full bg-slate-100 text-slate-800 border border-slate-200">
                    {totalMembers} members
                  </span>
                </div>
                <p className="text-xs sm:text-sm text-slate-500 mt-1">
                  Roster, load, and availability across all event verticals.
                </p>
              </div>

              {/* Admin Actions: Invite + Rebalance */}
              {isAdmin && (
                <div className="flex items-center gap-2.5">
                  <button
                    onClick={() => {
                      setGeneratedLink('');
                      setInviteEmail('');
                      setInviteModal(true);
                    }}
                    className="flex items-center gap-1.5 px-3.5 py-2 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 rounded-xl border border-slate-300 transition-colors"
                  >
                    <span>+ Invite Member</span>
                  </button>

                  <button
                    onClick={() => setRebalanceModal(true)}
                    className="flex items-center gap-1.5 px-4 py-2 text-xs font-bold rounded-xl text-white bg-[#0E7490] hover:bg-[#0c627a] transition-all shadow-xs"
                    title="AI Workload Rebalance Suggestions"
                  >
                    <span>✦ Rebalance Workload</span>
                  </button>
                </div>
              )}
            </div>

            {/* TOP STAT ROW: Active | Overloaded | Free | Avg load */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="clean-card p-5">
                <div className="text-slate-500 text-xs font-semibold uppercase tracking-wider">Active Roster</div>
                <div className="text-3xl font-black text-black tracking-tight mt-1">{activeCount}</div>
                <p className="text-xs font-medium text-emerald-600 mt-1">✓ Full engagement</p>
              </div>

              <div className={`clean-card p-5 ${overloadedCount > 0 ? 'border-red-200 bg-red-50/20' : ''}`}>
                <div className="text-slate-500 text-xs font-semibold uppercase tracking-wider">Overloaded (&gt;6 tasks)</div>
                <div className="flex items-baseline gap-2 mt-1">
                  <span className={`text-3xl font-black tracking-tight ${overloadedCount > 0 ? 'text-[#DC2626]' : 'text-black'}`}>
                    {overloadedCount}
                  </span>
                  {overloadedCount > 0 && (
                    <span className="text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-red-100 text-[#DC2626]">
                      Action Needed
                    </span>
                  )}
                </div>
                <p className="text-xs font-medium text-slate-500 mt-1">Threshold: 6 active assignments</p>
              </div>

              <div className="clean-card p-5">
                <div className="text-slate-500 text-xs font-semibold uppercase tracking-wider">Free (0 tasks)</div>
                <div className="text-3xl font-black text-black tracking-tight mt-1">{freeCount}</div>
                <p className="text-xs font-medium text-slate-500 mt-1">Available for delegation</p>
              </div>

              <div className="clean-card p-5">
                <div className="text-slate-500 text-xs font-semibold uppercase tracking-wider">Average Load</div>
                <div className="text-3xl font-black text-black tracking-tight mt-1">{avgLoad} <span className="text-xs font-semibold text-slate-500">tasks / person</span></div>
                <p className="text-xs font-medium text-slate-500 mt-1">Even distribution target: ~3.0</p>
              </div>
            </div>

            {/* SEARCH & FILTERS */}
            <div className="clean-card p-4 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2 flex-1 max-w-md">
                <input
                  type="text"
                  placeholder="Search by volunteer name or skill (e.g. Canva, React, EMT)..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-black"
                />
              </div>

              <div className="flex items-center gap-2 text-xs">
                <span className="text-slate-400 font-medium">Vertical:</span>
                <select
                  value={selectedVertical}
                  onChange={e => setSelectedVertical(e.target.value)}
                  className="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-800 font-semibold focus:outline-none focus:ring-1 focus:ring-black cursor-pointer"
                >
                  <option value="all">All Verticals</option>
                  <option value="Logistics">Logistics</option>
                  <option value="Technical">Technical</option>
                  <option value="Marketing">Marketing</option>
                  <option value="Sponsorship">Sponsorship</option>
                  <option value="Operations">Operations</option>
                </select>

                {(searchQuery || selectedVertical !== 'all') && (
                  <button
                    onClick={() => {
                      setSearchQuery('');
                      setSelectedVertical('all');
                    }}
                    className="text-xs font-bold text-slate-500 hover:text-black underline ml-2"
                  >
                    Reset
                  </button>
                )}
              </div>
            </div>

            {/* SKELETON LOADER */}
            {loading ? (
              <div className="clean-card p-6 space-y-4">
                {[...Array(5)].map((_, i) => (
                  <div key={i} className="h-12 bg-slate-100 rounded-xl animate-pulse"></div>
                ))}
              </div>
            ) : filteredMembers.length === 0 ? (
              /* EMPTY STATE */
              <div className="clean-card p-12 text-center max-w-lg mx-auto my-8">
                <div className="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                  👥
                </div>
                <h3 className="text-base font-bold text-slate-900">No volunteers found</h3>
                <p className="text-xs text-slate-500 mt-1 max-w-sm mx-auto">
                  No member matches "{searchQuery}". Try searching another skill tag or resetting vertical filters.
                </p>
                <button
                  onClick={() => {
                    setSearchQuery('');
                    setSelectedVertical('all');
                  }}
                  className="mt-4 px-4 py-2 bg-black text-white text-xs font-bold rounded-xl"
                >
                  Reset Search
                </button>
              </div>
            ) : (
              /* ROSTER TABLE */
              <div className="clean-card overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider text-[10px]">
                      <tr>
                        <th className="p-4">Member</th>
                        <th className="p-4">Role</th>
                        <th className="p-4">Vertical</th>
                        <th className="p-4">Skills</th>
                        <th className="p-4">Open Tasks</th>
                        <th className="p-4 w-36">Load Bar</th>
                        <th className="p-4">Availability (Mon-Sun)</th>
                        <th className="p-4 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredMembers.map(m => {
                        const isOverloaded = m.openTasks > 6;
                        const loadPercent = Math.min((m.openTasks / 8) * 100, 100);

                        return (
                          <tr key={m.id} className="hover:bg-slate-50/70 transition-colors">
                            {/* Member Name + Avatar */}
                            <td className="p-4">
                              <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-full bg-slate-900 text-white font-bold text-xs flex items-center justify-center flex-shrink-0">
                                  {m.avatar}
                                </div>
                                <div>
                                  <p className="font-bold text-slate-900 leading-tight">{m.name}</p>
                                  <p className="text-[11px] text-slate-400">{m.email}</p>
                                </div>
                              </div>
                            </td>

                            {/* Inline Role Selector (Admin Only) */}
                            <td className="p-4">
                              {isAdmin ? (
                                <select
                                  value={m.role}
                                  onChange={e => handleRoleChange(m.id, e.target.value)}
                                  className="bg-slate-100 border border-slate-200 rounded-lg px-2 py-1 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-black cursor-pointer"
                                >
                                  <option value="Volunteer">Volunteer</option>
                                  <option value="Core Team">Core Team</option>
                                  <option value="Vertical Lead">Vertical Lead</option>
                                </select>
                              ) : (
                                <span className="font-semibold text-slate-700 bg-slate-100 px-2 py-0.5 rounded text-[11px]">
                                  {m.role}
                                </span>
                              )}
                            </td>

                            {/* Vertical */}
                            <td className="p-4 font-semibold text-slate-700">{m.vertical}</td>

                            {/* Skills Tags */}
                            <td className="p-4">
                              <div className="flex flex-wrap gap-1 max-w-xs">
                                {m.skills.map((s, idx) => (
                                  <span key={idx} className="text-[10px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-medium border border-slate-200">
                                    {s}
                                  </span>
                                ))}
                              </div>
                            </td>

                            {/* Open Tasks */}
                            <td className="p-4">
                              <span className={`font-black text-xs ${isOverloaded ? 'text-[#DC2626]' : 'text-slate-900'}`}>
                                {m.openTasks} tasks
                              </span>
                            </td>

                            {/* Visual Load Bar */}
                            <td className="p-4">
                              <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div
                                  className={`h-full rounded-full transition-all ${
                                    isOverloaded ? 'bg-[#DC2626]' : m.openTasks === 0 ? 'bg-slate-300' : 'bg-[#2563EB]'
                                  }`}
                                  style={{ width: `${loadPercent}%` }}
                                ></div>
                              </div>
                              <span className="text-[10px] text-slate-400 mt-1 block">
                                {isOverloaded ? '⚠️ Overload Alert' : m.openTasks === 0 ? 'Ready for work' : `${m.openTasks} of 8 capacity`}
                              </span>
                            </td>

                            {/* Availability Dots (Mon - Sun) */}
                            <td className="p-4">
                              <div className="flex items-center gap-1.5" title="Mon - Sun availability indicators">
                                {m.availability.map((avail, idx) => (
                                  <div key={idx} className="flex flex-col items-center">
                                    <span
                                      className={`w-3 h-3 rounded-full ${
                                        avail ? 'bg-emerald-500' : 'bg-slate-200'
                                      }`}
                                      title={`${DAYS[idx]}: ${avail ? 'Available' : 'Busy'}`}
                                    ></span>
                                    <span className="text-[8px] text-slate-400 mt-0.5">{DAYS[idx]}</span>
                                  </div>
                                ))}
                              </div>
                            </td>

                            {/* Row Actions */}
                            <td className="p-4 text-right">
                              <div className="inline-flex items-center gap-1.5">
                                <button
                                  onClick={() => {
                                    setTargetMember(m);
                                    setMessageModal(true);
                                  }}
                                  className="p-1.5 rounded-lg text-slate-600 hover:text-black hover:bg-slate-100"
                                  title="Send Message"
                                >
                                  💬
                                </button>

                                <a
                                  href={`tasks.html`}
                                  className="p-1.5 rounded-lg text-slate-600 hover:text-black hover:bg-slate-100"
                                  title="View Tasks"
                                >
                                  📋
                                </a>

                                {isAdmin && (
                                  <>
                                    <button
                                      onClick={() => {
                                        setTargetMember(m);
                                        setNewVertical(m.vertical);
                                        setReassignVerticalModal(true);
                                      }}
                                      className="p-1.5 rounded-lg text-slate-600 hover:text-black hover:bg-slate-100"
                                      title="Reassign Vertical"
                                    >
                                      🔀
                                    </button>

                                    <button
                                      onClick={() => {
                                        setTargetMember(m);
                                        setRemoveConfirmModal(true);
                                      }}
                                      className="p-1.5 rounded-lg text-red-500 hover:text-red-700 hover:bg-red-50"
                                      title="Remove from Event"
                                    >
                                      🗑️
                                    </button>
                                  </>
                                )}
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* ADMIN MODAL: AI Workload Rebalance */}
          {rebalanceModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center gap-2">
                  <span className="w-8 h-8 rounded-xl bg-cyan-100 text-[#0E7490] flex items-center justify-center font-bold">✦</span>
                  <div>
                    <h3 className="text-base font-bold text-slate-900">AI Workload Rebalance Suggestions</h3>
                    <p className="text-[11px] text-slate-500">Algorithmic load redistribution based on active tasks and availability.</p>
                  </div>
                </div>

                <div className="space-y-3 pt-2">
                  {rebalanceSuggestions.map(sug => (
                    <div key={sug.id} className="p-3 rounded-xl border border-cyan-200 bg-cyan-50/50 space-y-1 text-xs">
                      <div className="flex items-center justify-between font-bold text-slate-900">
                        <span>{sug.from} ➔ {sug.to}</span>
                        <span className="text-[10px] font-black px-1.5 py-0.2 rounded bg-[#0E7490] text-white">Suggested</span>
                      </div>
                      <p className="font-semibold text-slate-800">Task: "{sug.task}"</p>
                      <p className="text-[11px] text-slate-500 italic">{sug.reason}</p>
                    </div>
                  ))}
                </div>

                <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                  <button onClick={() => setRebalanceModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                    Cancel
                  </button>
                  <button onClick={handleApplyRebalance} className="btn-black px-4 py-2 text-xs font-bold rounded-xl flex items-center gap-1.5">
                    <span>Approve & Apply Redistribution</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ADMIN MODAL: Invite Member */}
          {inviteModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-md w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-lg font-bold text-slate-900">Invite New Member</h3>
                <p className="text-xs text-slate-500">Send an invitation to onboard a student volunteer to TechNova 2026.</p>

                <form onSubmit={handleSendInvite} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Email Address:</label>
                    <input
                      type="email"
                      required
                      placeholder="student@campus.edu"
                      value={inviteEmail}
                      onChange={e => setInviteEmail(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-medium focus:ring-2 focus:ring-black"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Role:</label>
                      <select
                        value={inviteRole}
                        onChange={e => setInviteRole(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-black"
                      >
                        <option value="Volunteer">Volunteer</option>
                        <option value="Core Team">Core Team</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Vertical:</label>
                      <select
                        value={inviteVertical}
                        onChange={e => setInviteVertical(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-black"
                      >
                        <option value="Logistics">Logistics</option>
                        <option value="Technical">Technical</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sponsorship">Sponsorship</option>
                        <option value="Operations">Operations</option>
                      </select>
                    </div>
                  </div>

                  {generatedLink && (
                    <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs space-y-1">
                      <p className="font-bold text-emerald-800">Invite Link Generated:</p>
                      <input
                        readOnly
                        value={generatedLink}
                        className="w-full bg-white border border-emerald-300 rounded px-2 py-1 text-[11px] font-mono select-all"
                      />
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setInviteModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                      Close
                    </button>
                    <button type="submit" className="btn-black px-4 py-2 text-xs font-bold rounded-xl">
                      Send Invitation
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADMIN MODAL: Reassign Vertical */}
          {reassignVerticalModal && targetMember && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-md w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-lg font-bold text-slate-900">Reassign Vertical</h3>
                <p className="text-xs text-slate-500">
                  Select a new department vertical for <strong className="text-black">{targetMember.name}</strong>.
                </p>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Vertical:</label>
                  <select
                    value={newVertical}
                    onChange={e => setNewVertical(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-black"
                  >
                    <option value="Logistics">Logistics</option>
                    <option value="Technical">Technical</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Sponsorship">Sponsorship</option>
                    <option value="Operations">Operations</option>
                  </select>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setReassignVerticalModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                    Cancel
                  </button>
                  <button onClick={handleConfirmReassignVertical} className="btn-black px-4 py-2 text-xs font-bold rounded-xl">
                    Save Changes
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* DESTRUCTIVE CONFIRMATION MODAL: Remove Member */}
          {removeConfirmModal && targetMember && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-md w-full p-6 space-y-4 shadow-2xl border-red-200">
                <div className="flex items-center gap-2 text-red-600">
                  <span className="text-xl">⚠️</span>
                  <h3 className="text-lg font-bold">Remove Member from Event</h3>
                </div>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Are you sure you want to remove <strong className="text-black">{targetMember.name}</strong> from TechNova 2026? Their {targetMember.openTasks} open tasks will become unassigned and need redistribution.
                </p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setRemoveConfirmModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                    Cancel
                  </button>
                  <button onClick={handleConfirmRemove} className="px-4 py-2 text-xs font-bold bg-red-600 hover:bg-red-700 text-white rounded-xl">
                    Confirm Removal
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Message Modal */}
          {messageModal && targetMember && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-md w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-base font-bold text-slate-900">Direct Message to {targetMember.name}</h3>
                <textarea
                  rows="3"
                  value={msgContent}
                  onChange={e => setMsgContent(e.target.value)}
                  placeholder={`Write a quick message or task check-in to ${targetMember.name}...`}
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium focus:ring-2 focus:ring-black"
                ></textarea>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setMessageModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      showToast(`Message dispatched to ${targetMember.name}!`);
                      setMessageModal(false);
                      setMsgContent('');
                    }}
                    className="btn-black px-4 py-2 text-xs font-bold rounded-xl"
                  >
                    Send Message
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Navigation Sidebar Drawer */}
          {sidebarOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity" onClick={() => setSidebarOpen(false)}></div>
              <div className="fixed inset-y-0 left-0 max-w-full flex pr-10">
                <div className="w-screen max-w-xs sm:max-w-sm bg-white shadow-2xl border-r border-[#E2E8F0] flex flex-col justify-between">
                  <div>
                    <div className="p-5 border-b border-[#E2E8F0] flex items-center justify-between bg-[#F8FAFC]">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-white border border-[#E2E8F0] shadow-xs flex items-center justify-center p-1">
                          <img src="planova-logo.jpg" alt="Logo" className="w-full h-full object-contain" onError={e => { e.target.style.display='none'; e.target.parentElement.innerHTML='<span class="font-black text-black">P</span>'; }} />
                        </div>
                        <div>
                          <h3 className="text-base font-black text-black leading-tight">PLANOVA</h3>
                          <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Navigation Menu</p>
                        </div>
                      </div>
                      <button onClick={() => setSidebarOpen(false)} className="p-1.5 rounded-lg text-slate-400 hover:text-black hover:bg-slate-200 transition-colors">
                        ✕
                      </button>
                    </div>

                    <nav className="p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-160px)]">
                      <div className="px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                        Main Overview
                      </div>
                      {NAV_ITEMS.slice(0, 1).map(item => (
                        <a key={item.name} href={item.path} className="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:text-black hover:bg-slate-100 transition-all">
                          <span className="flex items-center gap-2.5">
                            <span className="text-sm">{item.icon}</span>
                            <span>{item.name}</span>
                          </span>
                          <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-bold border border-slate-200">
                            {item.badge}
                          </span>
                        </a>
                      ))}

                      <div className="pt-4 px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                        Admin Core Modules
                      </div>
                      {NAV_ITEMS.slice(1).map(item => (
                        <a
                          key={item.name}
                          href={item.path}
                          className={`flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                            item.active ? 'bg-black text-white shadow-xs' : 'text-slate-700 hover:text-black hover:bg-slate-100'
                          }`}
                        >
                          <span className="flex items-center gap-2.5">
                            <span className="text-sm">{item.icon}</span>
                            <span>{item.name}</span>
                          </span>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-extrabold ${
                            item.active ? 'bg-slate-800 text-slate-200' : 'bg-slate-100 text-slate-600 border border-slate-200'
                          }`}>
                            {item.badge}
                          </span>
                        </a>
                      ))}
                    </nav>
                  </div>

                  <div className="p-4 border-t border-[#E2E8F0] bg-[#F8FAFC] flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center">
                        J
                      </div>
                      <div>
                        <p className="text-xs font-bold text-black leading-tight">Jenish</p>
                        <p className="text-[10px] font-extrabold text-slate-500 uppercase">{isAdmin ? 'President (Admin)' : 'Member'}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2 animate-bounce border border-slate-700">
              <span className="text-emerald-400">✓</span>
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<VolunteersApp />, document.getElementById('root'));
  </script>
</body>
</html>
