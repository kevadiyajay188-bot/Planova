  <style>
    *, *::before, *::after { box-sizing: border-box; }

      color: #0F172A;

    }

    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Clean Card base */

    /* Black buttons */

    }
    .btn-black:hover {
      background-color: #1E293B;
      transform: translateY(-1px);
    }
    .btn-black:active {
      transform: scale(0.98);
    }

    .btn-ghost {
      background-color: #FFFFFF;
      color: #0F172A;
      border: 1px solid #E2E8F0;
      transition: all 150ms ease;
    }
    .btn-ghost:hover {
      background-color: #F8FAFC;
      border-color: #CBD5E1;
    }

    /* Skeleton shimmer animation */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer-box {
      background: linear-gradient(90deg, #F1F5F9 25%, #E2E8F0 50%, #F1F5F9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite;
    }

    /* Smooth fade in */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-modal {
      animation: fadeIn 200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .btn-black { transition: all 150ms ease-out; }
    .btn-black:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.30); }
    .btn-black:active:not(:disabled) { transform: translateY(0); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.20); }
    .ai-action-button { transition: transform 150ms ease-out, box-shadow 150ms ease-out; }
    .ai-action-button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(14, 116, 144, 0.28); }
    .ai-action-button:active:not(:disabled) { transform: translateY(0); box-shadow: 0 2px 6px rgba(14, 116, 144, 0.18); }
    @keyframes loadingActionPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.08); } }
    .loading-action { animation: loadingActionPulse 900ms ease-in-out infinite; }
    button[aria-label], button[title*="Menu"], button[title*="Close"], button[title*="Delete"], button[title*="Edit"], button[title*="Previous"], button[title*="Next"], button[title*="Notification"] { transition: transform 150ms ease-out; }
    button[aria-label]:hover, button[title*="Menu"]:hover, button[title*="Close"]:hover, button[title*="Delete"]:hover, button[title*="Edit"]:hover, button[title*="Previous"]:hover, button[title*="Next"]:hover, button[title*="Notification"]:hover { transform: scale(1.03); }
    button[aria-label]:active, button[title*="Menu"]:active, button[title*="Close"]:active, button[title*="Delete"]:active, button[title*="Edit"]:active, button[title*="Previous"]:active, button[title*="Next"]:active, button[title*="Notification"]:active { transform: scale(1); }
      @media (hover: none) and (pointer: coarse) {

    /* ══════════════════════════════════════════════════════════
       FALLBACK / SEED DATASET  (Resilient client backup)
       ══════════════════════════════════════════════════════════ */
    function daysFromNow(days, hour = 10) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      d.setHours(hour, 0, 0, 0);
      return d.toISOString();
    }

    const INITIAL_FEATURED = [];

    const RECENT_NOTICES = [];

    const INITIAL_FEED = [];

    /* ══════════════════════════════════════════════════════════
       FORMATTING HELPERS & CALENDAR GENERATOR
       ══════════════════════════════════════════════════════════ */
    function formatEventDate(dateString) {
      try {
        const d = new Date(dateString);
        return d.toLocaleDateString('en-US', {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });
      } catch {
        return dateString;
      }
    }

    function formatTime(dateString) {
      try {
        const d = new Date(dateString);
        return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      } catch {
        return '09:00 AM';
      }
    }

    function timeAgo(dateString) {
      try {
        const d = new Date(dateString);
        const diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
        if (diffSec < 3600) return `${Math.max(1, Math.floor(diffSec / 60))}m ago`;
        if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h ago`;
        return `${Math.floor(diffSec / 86400)}d ago`;
      } catch {
        return '';
      }
    }

    // Google Calendar URL builder
    function buildGoogleCalendarUrl(event) {
      const title = encodeURIComponent(event.title || 'Campus Event');
      const details = encodeURIComponent(`${event.preview || event.body || ''}\n\nOrganized by: ${event.clubName || ''} (${event.collegeName || ''})`);
      const location = encodeURIComponent(event.venue || 'Campus');
      const startIso = new Date(event.eventDate || Date.now()).toISOString().replace(/-|:|\.\d+/g, '');
      const endIso = new Date(new Date(event.eventDate || Date.now()).getTime() + 2 * 3600000).toISOString().replace(/-|:|\.\d+/g, '');
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&location=${location}&dates=${startIso}/${endIso}`;
    }

    // Download iCal .ics file
    function downloadIcsFile(event) {
      const startIso = new Date(event.eventDate || Date.now()).toISOString().replace(/-|:|\.\d+/g, '');
      const endIso = new Date(new Date(event.eventDate || Date.now()).getTime() + 2 * 3600000).toISOString().replace(/-|:|\.\d+/g, '');
      const icsData = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Planova Campus Discovery//EN',
        'BEGIN:VEVENT',
        `UID:${event.id || Date.now()}@planova.campus`,
        `DTSTAMP:${startIso}`,
        `DTSTART:${startIso}`,
        `DTEND:${endIso}`,
        `SUMMARY:${event.title || 'Campus Event'}`,
        `DESCRIPTION:${(event.preview || event.body || '').replace(/\n/g, ' ')}`,
        `LOCATION:${event.venue || 'Campus'}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', `${(event.title || 'event').replace(/[^a-zA-Z0-9]/g, '_')}.ics`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    /* ══════════════════════════════════════════════════════════

    /* ══════════════════════════════════════════════════════════

       ══════════════════════════════════════════════════════════ */
    function FeaturedHeroCarousel({ events, onSelectEvent, onAddToCalendar }) {
      if (!events || events.length === 0) return null;

      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPaused, setIsPaused] = useState(false);
      const touchStartX = useRef(0);
      const touchEndX = useRef(0);

      const nextSlide = () => {
        setCurrentIndex((prev) => (prev + 1) % events.length);
      };

      const prevSlide = () => {
        setCurrentIndex((prev) => (prev - 1 + events.length) % events.length);
      };

      useEffect(() => {
        if (isPaused || events.length <= 1) return;
        const timer = setInterval(nextSlide, 6000);
        return () => clearInterval(timer);
      }, [isPaused, events.length]);

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
      };

      const handleTouchEnd = (e) => {
        touchEndX.current = e.changedTouches[0].clientX;
        const diff = touchStartX.current - touchEndX.current;
        if (diff > 50) nextSlide();
        else if (diff < -50) prevSlide();
      };

      const current = events[currentIndex];
      const categoryStyle = CATEGORY_COLORS[current.category] || CATEGORY_COLORS.Hackathon;

      return (
        <section
          className="relative w-full rounded-3xl overflow-hidden shadow-xl bg-slate-950 border border-slate-800"
          onMouseEnter={() => setIsPaused(true)}

    function CategoryChips({ selectedCategory, onSelectCategory, categoryCounts }) {
      return (
        <div className="flex items-center gap-2 overflow-x-auto hide-scrollbar py-2">
          {ALL_CATEGORIES.map((cat) => {
            const isActive = selectedCategory === cat;
            const styleConfig = CATEGORY_COLORS[cat];
            const count = categoryCounts[cat] || 0;

            if (cat === 'All') {
              return (
                <button
                  key={cat}
                  onClick={() => onSelectCategory('All')}
                  className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all border ${
                    isActive

                  }`}

                  All Categories
                  {count > 0 && (
                    <span className={`ml-2 px-1.5 py-0.5 rounded-full text-[10px] ${
                      isActive ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-600'

                      {count}
                    </span>

              <button
                key={cat}

                      isActive

            </div>

            <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
              {events.map((evt) => (
                <div
                  key={evt.id}
                  className="p-3 rounded-2xl border border-slate-200 hover:border-black flex items-center justify-between gap-3 transition-colors bg-slate-50/50 hover:bg-white"
                >
                  <div className="min-w-0">
                    <h4 className="text-xs font-bold text-slate-900 truncate">{evt.title}</h4>
                    <p className="text-[11px] text-slate-500 truncate">{formatEventDate(evt.eventDate)} · {evt.venue}</p>
                  </div>
                  <div className="flex items-center gap-1.5 flex-shrink-0">
                    <a
                      href={buildGoogleCalendarUrl(evt)}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="btn-black px-2.5 py-1.5 rounded-lg text-[11px] font-bold"
                    >
                      Google
                    </a>
                    <button
                      onClick={() => downloadIcsFile(evt)}
                      className="btn-ghost px-2.5 py-1.5 rounded-lg text-[11px] font-bold"
                      title="Download .ics for Apple/Outlook"
                    >
                      .ICS
                    </button>
                  </div>
                </div>
              ))}
            </div>

            <div className="pt-2 border-t border-slate-100 flex items-center justify-between">
              <span className="text-xs text-slate-500 font-medium">{events.length} events scheduled</span>
              <button
                onClick={onClose}
                className="btn-ghost px-4 py-2 rounded-xl text-xs font-bold"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════
       SHIMMER SKELETON CARDS
       ══════════════════════════════════════════════════════════ */
    function SkeletonCard() {
      return (
        <div className="discovery-card overflow-hidden border border-slate-200 bg-white">
          <div className="aspect-video w-full shimmer-box" />
          <div className="p-5 space-y-3">
            <div className="w-1/3 h-3 shimmer-box rounded-md" />
            <div className="w-4/5 h-5 shimmer-box rounded-md" />
            <div className="w-1/2 h-3.5 shimmer-box rounded-md" />
            <div className="space-y-1.5 pt-2">
              <div className="w-full h-3 shimmer-box rounded-md" />
              <div className="w-3/4 h-3 shimmer-box rounded-md" />
            </div>
            <div className="flex items-center justify-between pt-3 border-t border-slate-100">
              <div className="w-6 h-6 shimmer-box rounded-md" />
              <div className="w-24 h-6 shimmer-box rounded-md" />
            </div>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════
       EMPTY STATE
       ══════════════════════════════════════════════════════════ */
    function EmptyState({ category, onResetFilters }) {
      return (
        <div className="py-16 px-6 text-center max-w-md mx-auto clean-card bg-white border border-slate-200 my-8">
          <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-slate-100 text-black flex items-center justify-center shadow-xs">
            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
          </div>
          <h3 className="text-base font-bold text-slate-900 mb-1">
            {category && category !== 'All' ? `No ${category} events right now` : 'No announcements found'}
          </h3>
          <p className="text-xs text-slate-500 leading-relaxed mb-5">
            {category && category !== 'All'
              ? `Check back soon! Campus clubs regularly post new ${category} competitions and workshops.`
              : "Nothing posted yet that matches your filter. When a club shares an update, it'll show up here."}
          </p>
          <button
            onClick={onResetFilters}
            className="btn-black px-5 py-2.5 rounded-xl text-xs font-bold shadow-xs"
          >
            Show All Announcements
          </button>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════
       MAIN STUDENT ANNOUNCEMENTS APPLICATION
       ══════════════════════════════════════════════════════════ */
    function StudentAnnouncementsApp() {
      const [featuredList, setFeaturedList] = useState([]);
      const [feedList, setFeedList] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      // Filter & sorting states
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortOption, setSortOption] = useState('newest');
      const [scope, setScope] = useState('all');
      const [showSavedOnly, setShowSavedOnly] = useState(false);

      // Selected modal & toast state
      const [activeModalItem, setActiveModalItem] = useState(null);
      const [showCalendarModal, setShowCalendarModal] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Saved state storage sync
      const [savedIds, setSavedIds] = useState(() => {
        try {
          const stored = localStorage.getItem('planova_saved_announcements');
          return stored ? JSON.parse(stored) : ['ann-roboquest-2026'];
        } catch {
          return ['ann-roboquest-2026'];
        }
      });

      const handleSelectAnnouncement = async (ann) => {
          setActiveModalItem({ ...ann, loadingDetails: true });
          try {
            const res = await fetch(`/api/announcements/${ann.id}`);
            if (res.ok) {
              const data = await res.json();
              setActiveModalItem(prev => prev && prev.id === data.id ? { ...data, loadingDetails: false } : prev);
            } else {
              setActiveModalItem(prev => prev && prev.id === ann.id ? { ...prev, loadingDetails: false } : prev);
            }
          } catch {
            setActiveModalItem(prev => prev && prev.id === ann.id ? { ...prev, loadingDetails: false } : prev);
          }
        };

        const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // AI Copilot state
      const [copilotOpen, setCopilotOpen] = useState(false);
      const [copilotQuery, setCopilotQuery] = useState('');
      const [copilotLoading, setCopilotLoading] = useState(false);
      const [copilotMessages, setCopilotMessages] = useState([
        { role: 'ai', text: 'Hello! I am Planova AI Copilot powered by Gemini. I can help you discover upcoming campus hackathons, workshops, or answer questions about clubs and schedules. How can I assist you today?' }
      ]);

      const handleCopilotSubmit = (e) => {
        e.preventDefault();
        if (!copilotQuery.trim() || copilotLoading) return;
        const msg = copilotQuery;
        setCopilotMessages(m => [...m, { role: 'user', text: msg }]);
        setCopilotQuery('');
        setCopilotLoading(true);
        fetch('/api/ai/copilot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        })
          .then(r => r.json())
          .then(data => {
            const reply = data.text || data.response || 'Processed with Planova Gemini AI.';
            setCopilotMessages(m => [...m, { role: 'ai', text: reply }]);
          })
          .catch(() => {
            setCopilotMessages(m => [...m, { role: 'ai', text: 'AI Copilot is momentarily unavailable. Please try again.' }]);
          })
          .finally(() => setCopilotLoading(false));
      };

      // Load data from backend API with fallback
      useEffect(() => {
        let isMounted = true;
        async function loadData() {
          setLoading(true); setError(null);
          try {
            const [featRes, feedRes] = await Promise.all([
              fetch('/api/announcements/featured').catch(() => null),
              fetch('/api/announcements/feed').catch(err => { setError('Failed to load announcements'); return null; })
            ]);

            if (featRes && featRes.ok) {
              const featData = await featRes.json();
              if (isMounted && Array.isArray(featData) && featData.length > 0) {
                setFeaturedList(featData);
              } else {
                setFeaturedList(INITIAL_FEATURED);
              }
            } else {
              setFeaturedList(INITIAL_FEATURED);
            }

            if (feedRes && feedRes.ok) {
              const feedData = await feedRes.json();
              if (isMounted && Array.isArray(feedData) && feedData.length > 0) {
                setFeedList(feedData);
              } else {
                setFeedList(INITIAL_FEED);
              }
            } else {
              setFeedList(INITIAL_FEED);
            }
          } catch {
            if (isMounted) {
              setFeaturedList(INITIAL_FEATURED);
              setFeedList(INITIAL_FEED);
            }
          } finally {
            if (isMounted) setLoading(false);
          }
        }

        loadData();
        return () => { isMounted = false; };
      }, []);

      // Toggle bookmark / save
      const handleToggleSave = async (id) => {
        const isCurrentlySaved = savedIds.includes(id);
        const nextSaved = isCurrentlySaved
          ? savedIds.filter((item) => item !== id)
          : [...savedIds, id];

        setSavedIds(nextSaved);
        try {
          localStorage.setItem('planova_saved_announcements', JSON.stringify(nextSaved));
        } catch {}

        setFeedList((prev) =>
          prev.map((item) => (item.id === id ? { ...item, saved: !isCurrentlySaved } : item))
        );

        if (activeModalItem && activeModalItem.id === id) {
          setActiveModalItem((prev) => ({ ...prev, saved: !isCurrentlySaved }));
        }

        showToast(isCurrentlySaved ? 'Removed from your bookmarks' : '✓ Saved to your bookmarks');

        try {
          await fetch(`/api/announcements/${id}/save`, { method: 'POST' });
        } catch {}
      };

      // Add to calendar action
      const handleAddToCalendar = (item) => {
        window.open(buildGoogleCalendarUrl(item), '_blank');
        showToast('✓ Opened Google Calendar to add event');
      };

      // Share handler
      const handleShare = async (item) => {
        const url = `${window.location.origin}/announcements#${item.id}`;
        if (navigator.share) {
          try {
            await navigator.share({
              title: item.title,
              text: `${item.title} by ${item.clubName}`,
              url
            });
            return;
          } catch {}
        }
        try {
          await navigator.clipboard.writeText(url);
          showToast('✓ Link copied to clipboard!');
        } catch {
          showToast('Link: ' + url);
        }
      };

      // Category counts
      const categoryCounts = useMemo(() => {
        const counts = { All: feedList.length };
        feedList.forEach((item) => {
          counts[item.category] = (counts[item.category] || 0) + 1;
        });
        return counts;
      }, [feedList]);

      // Filtered & sorted feed
      const filteredFeed = useMemo(() => {
        let result = feedList.map((item) => ({
          ...item,
          saved: savedIds.includes(item.id)
        }));

        if (showSavedOnly) {
          result = result.filter((item) => item.saved);
        }

        if (selectedCategory !== 'All') {
          result = result.filter(
            (item) => (item.category || '').toLowerCase() === selectedCategory.toLowerCase()
          );
        }

        if (scope === 'my-clubs') {
          result = result.filter((item) => item.isMyClub);
        }

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          result = result.filter(
            (item) =>
              (item.title || '').toLowerCase().includes(q) ||
              (item.clubName || '').toLowerCase().includes(q) ||
              (item.collegeName || '').toLowerCase().includes(q) ||
              (item.venue || '').toLowerCase().includes(q) ||
              (item.category || '').toLowerCase().includes(q)
          );
        }

        if (sortOption === 'this_week') {
          const now = Date.now();
          const in7Days = now + 7 * 24 * 60 * 60 * 1000;
          result = result.filter((item) => {
            const t = new Date(item.eventDate).getTime();
            return t >= now - 24 * 60 * 60 * 1000 && t <= in7Days;
          });
        } else if (sortOption === 'happening_soon') {
          result.sort((a, b) => new Date(a.eventDate).getTime() - new Date(b.eventDate).getTime());
        } else {
          result.sort((a, b) => new Date(b.postedAt).getTime() - new Date(a.postedAt).getTime());
        }

        return result;
      }, [feedList, savedIds, selectedCategory, scope, searchQuery, sortOption, showSavedOnly]);

      const handleResetFilters = () => {
        setSelectedCategory('All');
        setSearchQuery('');
        setScope('all');
        setShowSavedOnly(false);
        setSortOption('newest');
      };

      return (
        <div className="min-h-screen bg-[#F8FAFC] flex flex-col">

          {/* 1. TOP BAR */}
          <TopBar
            searchQuery={searchQuery}
            onSearchChange={setSearchQuery}
            savedCount={savedIds.length}
            onToggleSavedFilter={() => setShowSavedOnly((prev) => !prev)}
            showingSavedOnly={showSavedOnly}
            onOpenCalendarSync={() => setShowCalendarModal(true)}
            onOpenCopilot={() => setCopilotOpen(true)}
          />

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-8">

            {/* 2. FEATURED / SPOTLIGHT SECTION */}
            {!searchQuery && selectedCategory === 'All' && !showSavedOnly && scope === 'all' && (
              <FeaturedHeroCarousel
                events={featuredList}
                onSelectEvent={(evt) => {
                  const matchingFeedItem = feedList.find((item) => item.id === evt.id) || evt;
                  setActiveModalItem(matchingFeedItem);
                }}
                onAddToCalendar={handleAddToCalendar}
              />
            )}

            {/* ── Recent Announcements (Moved from user.html) ── */}
            {!searchQuery && selectedCategory === 'All' && !showSavedOnly && (
              <RecentNoticesSection
                notices={RECENT_NOTICES}
                onSelectNotice={(notice) => { handleSelectAnnouncement({ id: notice.id, title: notice.title }); }}
              />
            )}

            {/* 3. CATEGORY FILTER CHIPS */}
            <div className="space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                    Campus Announcements Feed
                  </h1>
                  <p className="text-xs text-slate-500 font-medium mt-0.5">
                    Live discovery wall for hackathons, workshops, and club events across colleges
                  </p>
                </div>

                <a
                  href="announcements.html"
                  className="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[11px] font-bold text-slate-600 hover:text-black bg-white border border-slate-200 hover:bg-slate-50 transition-colors"
                  title="Switch to Club Admin Announcements"
                >
                  <span>Admin Mode</span>
                  <span className="text-slate-400">→</span>
                </a>
              </div>

              <CategoryChips
                selectedCategory={selectedCategory}
                onSelectCategory={setSelectedCategory}
                categoryCounts={categoryCounts}
              />
            </div>

            {/* 4. SORT / SCOPE ROW */}
            <div className="flex flex-wrap items-center justify-between gap-4 pt-2 border-t border-slate-200">
              <div className="flex items-center gap-2 text-xs font-bold text-slate-600">
                <span>
                  Showing <strong className="text-slate-900">{filteredFeed.length}</strong> announcements
                </span>
                {(selectedCategory !== 'All' || searchQuery || showSavedOnly || scope !== 'all') && (
                  <button
                    onClick={handleResetFilters}
                    className="text-[11px] font-semibold text-slate-900 hover:underline pl-2 border-l border-slate-200"
                  >
                    Clear filters
                  </button>
                )}
              </div>

              <div className="flex items-center gap-3 flex-wrap">
                {/* Scope Toggle: [All Colleges] [My Clubs] */}
                <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-bold">
                  <button
                    onClick={() => setScope('all')}
                    className={`px-3 py-1 rounded-lg transition-all ${
                      scope === 'all'
                        ? 'btn-black shadow-xs font-extrabold'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    All Colleges
                  </button>
                  <button
                    onClick={() => setScope('my-clubs')}
                    className={`px-3 py-1 rounded-lg transition-all ${
                      scope === 'my-clubs'
                        ? 'btn-black shadow-xs font-extrabold'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    My Clubs
                  </button>
                </div>

                {/* Sort Selector */}
                <div className="flex items-center gap-1.5 text-xs">
                  <span className="text-slate-400 font-semibold hidden sm:inline">Sort:</span>
                  <select
                    value={sortOption}
                    onChange={(e) => setSortOption(e.target.value)}
                    className="bg-white text-slate-800 font-bold border border-slate-200 rounded-xl px-3 py-1.5 text-xs focus:ring-2 focus:ring-black focus:outline-none cursor-pointer"
                  >
                    <option value="newest">Newest First</option>
                    <option value="this_week">This Week</option>
                    <option value="happening_soon">Happening Soon</option>
                  </select>
                </div>
              </div>
            </div>

            {/* 5. ANNOUNCEMENT POSTER WALL GRID */}
            {error ? (<div className="p-8 text-center bg-red-50 text-red-600 rounded-xl font-bold">{error}</div>) : loading ? (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {[...Array(6)].map((_, i) => (
                  <SkeletonCard key={i} />
                ))}
              </div>
            ) : filteredFeed.length > 0 ? (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredFeed.map((ann) => (
                  <AnnouncementCard
                    key={ann.id}
                    announcement={ann}
                    onSelect={handleSelectAnnouncement}
                    onToggleSave={handleToggleSave}
                    onAddToCalendar={handleAddToCalendar}
                  />
                ))}
              </div>
            ) : (
              <EmptyState
                category={selectedCategory}
                onResetFilters={handleResetFilters}
              />
            )}

          </main>

          {/* 6. ANNOUNCEMENT DETAIL MODAL */}
          {activeModalItem && (
            <AnnouncementDetailModal
              announcement={activeModalItem}
              onClose={() => setActiveModalItem(null)}
              onToggleSave={handleToggleSave}
              onShare={handleShare}
              onAddToCalendar={handleAddToCalendar}
            />
          )}

          {/* 7. CALENDAR SYNC MODAL */}
          {showCalendarModal && (
            <CalendarSyncModal
              events={feedList}
              onClose={() => setShowCalendarModal(false)}
              onSelectEventCalendar={handleAddToCalendar}
            />
          )}

          {/* Toast Alert */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-black text-white px-5 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2.5 border border-slate-700 animate-bounce">
              <span className="text-emerald-400 font-black">✓</span>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Floating Ask Planova Button */}
          <div className="fixed bottom-6 right-6 z-40">
            <button
              onClick={() => setCopilotOpen(true)}
              className="flex items-center gap-2.5 px-4 py-2.5 rounded-full bg-black hover:bg-slate-800 text-white text-xs font-bold transition-all shadow-2xl border border-slate-800 cursor-pointer group ai-action-button"
            >
              <span>✦ Ask Planova AI</span>
              <span className="flex h-2 w-2 relative">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2 w-2 bg-cyan-400"></span>
              </span>
            </button>
          </div>

          {/* Slide-over Copilot Drawer */}
          {copilotOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden modal-backdrop">
              <div className="absolute inset-0 bg-slate-900/30 backdrop-blur-sm" onClick={() => setCopilotOpen(false)}></div>
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-white shadow-2xl border-l border-[#E2E8F0] flex flex-col justify-between modal-panel">
                  <div className="p-5 border-b border-slate-800 flex items-center justify-between bg-black text-white">
                    <div className="flex items-center gap-2.5">
                      <span className="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center font-black">✦</span>
                      <div>
                        <h3 className="text-sm font-bold">Planova AI Copilot</h3>
                        <p className="text-[10px] text-slate-300">Powered by Gemini · Campus Intelligence</p>
                      </div>
                    </div>
                    <button onClick={() => setCopilotOpen(false)} className="text-slate-300 hover:text-white font-bold">✕</button>
                  </div>

                  <div className="flex-1 p-5 overflow-y-auto space-y-4 bg-[#F8FAFC]">
                    {copilotMessages.map((m, i) => (
                      <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[85%] rounded-2xl p-3.5 text-xs leading-relaxed ${
                          m.role === 'user' ? 'bg-black text-white rounded-br-none' : 'bg-white border border-[#E2E8F0] text-slate-900 rounded-bl-none shadow-sm'
                        }`}>
                          {m.text}
                        </div>
                      </div>
                    ))}
                    {copilotLoading && (
                      <div className="flex justify-start">
                        <div className="bg-white border border-[#E2E8F0] rounded-2xl rounded-bl-none shadow-sm px-4 py-3 text-xs text-slate-400 flex items-center gap-1.5">
                          <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{animationDelay:'0ms'}}></span>
                          <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{animationDelay:'150ms'}}></span>
                          <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{animationDelay:'300ms'}}></span>
                        </div>
                      </div>
                    )}
                  </div>

                  <form onSubmit={handleCopilotSubmit} className="p-4 border-t border-slate-200 bg-white flex gap-2">
                    <input
                      type="text"
                      value={copilotQuery}
                      onChange={e => setCopilotQuery(e.target.value)}
                      placeholder="Ask Planova AI about events..."
                      className="flex-1 px-3.5 py-2.5 text-xs border border-[#E2E8F0] rounded-xl focus:outline-none focus:ring-2 focus:ring-black text-slate-900"
                      disabled={copilotLoading}
                    />
                    <button type="submit" className={`px-4 py-2.5 bg-black hover:bg-slate-800 text-white font-bold rounded-xl transition-colors shadow-xs text-xs ${copilotLoading ? 'loading-action' : ''}`} disabled={copilotLoading}>
                      {copilotLoading ? '…' : 'Send'}
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-200 bg-white py-6 mt-12 text-center text-xs text-slate-400 font-medium">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="font-extrabold text-black">PLANOVA</span>
                <span>·</span>
                <span>Campus Club Hub</span>
              </div>
              <div className="flex items-center gap-4">
                <button onClick={() => setShowCalendarModal(true)} className="hover:text-black">Calendar Sync</button>
                <a href="announcements.html" className="hover:text-black">Admin Announcements</a>
                <a href="profile.html" className="hover:text-black">Student Profile</a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<StudentAnnouncementsApp />, document.getElementById('root'));
  </script>
</body>
</html>
