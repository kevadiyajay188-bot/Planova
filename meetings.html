      color: #0F1729;
      margin: 0;
      padding: 0;

    }
    .clean-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      transition: box-shadow 150ms ease, border-color 150ms ease;
    }
    .clean-card:hover {
      border-color: #CBD5E1;
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06);
    }
    .btn-black {
      background-color: #000000;
      color: #FFFFFF;
      transition: background-color 150ms ease;
    }
    .btn-black:hover {
      background-color: #1E293B;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    .btn-black { transition: all 150ms ease-out; }
    .btn-black:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.30); }
    .btn-black:active:not(:disabled) { transform: translateY(0); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.20); }
    .ai-action-button { transition: transform 150ms ease-out, box-shadow 150ms ease-out; }
    .ai-action-button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(14, 116, 144, 0.28); }
    .ai-action-button:active:not(:disabled) { transform: translateY(0); box-shadow: 0 2px 6px rgba(14, 116, 144, 0.18); }
    @keyframes loadingActionPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.08); } }
    .loading-action { animation: loadingActionPulse 900ms ease-in-out infinite; }
    @keyframes successActionPulse { 0% { transform: scale(1); box-shadow: none; } 45% { transform: scale(1.02); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.18); } 100% { transform: scale(1); box-shadow: none; } }
    .success-action { animation: successActionPulse 320ms ease-out; }
    button[aria-label], button[title*="Menu"], button[title*="Close"], button[title*="Delete"], button[title*="Edit"], button[title*="Previous"], button[title*="Next"], button[title*="Notification"] { transition: transform 150ms ease-out; }
    button[aria-label]:hover, button[title*="Menu"]:hover, button[title*="Close"]:hover, button[title*="Delete"]:hover, button[title*="Edit"]:hover, button[title*="Previous"]:hover, button[title*="Next"]:hover, button[title*="Notification"]:hover { transform: scale(1.03); }
    button[aria-label]:active, button[title*="Menu"]:active, button[title*="Close"]:active, button[title*="Delete"]:active, button[title*="Edit"]:active, button[title*="Previous"]:active, button[title*="Next"]:active, button[title*="Notification"]:active { transform: scale(1); }
      @media (hover: none) and (pointer: coarse) {
        .btn-black:hover, .ai-action-button:hover, button[aria-label]:hover, button[title*="Menu"]:hover, button[title*="Close"]:hover, button[title*="Delete"]:hover, button[title*="Edit"]:hover, button[title*="Previous"]:hover, button[title*="Next"]:hover, button[title*="Notification"]:hover { transform: none; box-shadow: none; }

      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [loading, setLoading] = useState(true);

      const [meetings, setMeetings] = useState(INITIAL_MEETINGS);

      const [newTranscript, setNewTranscript] = useState('');

        return () => clearTimeout(timer);
      }, []);

        return meetings.filter(m => m.hasUnreviewedItems).length;
      }, [meetings]);

      const filteredMeetings = useMemo(() => {
        if (needsReviewFilter) {
          return meetings.filter(m => m.hasUnreviewedItems);
        }
        return meetings;
      }, [meetings, needsReviewFilter]);

        if (!newTitle.trim()) return;
        setIsExtracting(true);

            id: `mtg-${Date.now()}`,
            title: newTitle.trim(),
            date: 'Today, Just now',

          };
          setMeetings(prev => [created, ...prev]);
          setIsExtracting(false);
          setNewMeetingModal(false);
          setNewTitle('');
          setNewTranscript('');
          showToast('✦ Meeting logged & AI action items extracted!');
        }, 1200);
      };

        if (!meetingToDelete) return;
        setMeetings(prev => prev.filter(m => m.id !== meetingToDelete.id));
        showToast(`Meeting "${meetingToDelete.title}" deleted.`);
        setDeleteConfirmModal(false);
        setMeetingToDelete(null);
      };

        setMeetings(prev => prev.map(m => {
          if (m.id === meetingId) {
            const updatedItems = [...m.actionItems];
            updatedItems[itemIndex] = { ...updatedItems[itemIndex], status: 'Accepted' };
            const allAccepted = updatedItems.every(i => i.status === 'Accepted');
            return {
              ...m,
              actionItems: updatedItems,
              acceptedCount: m.acceptedCount + 1,
              hasUnreviewedItems: !allAccepted,
              status: allAccepted ? 'reviewed' : 'ready'
            };
          }
          return m;
        }));
        showToast('Action item approved and added to Tasks board!');

                </button>
              </div>
            ) : (
              /* MEETING LIST */
              <div className="space-y-3">
                {filteredMeetings.map(mtg => {
                  const cfg = STATUS_CONFIG[mtg.status] || STATUS_CONFIG.reviewed;

                  return (
                    <div
                      key={mtg.id}
                      className={`clean-card p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 ${
                        mtg.hasUnreviewedItems ? 'border-amber-200/80 bg-amber-50/10' : ''
                      }`}
                    >
                      <div className="space-y-1.5 flex-1">
                        <div className="flex items-center gap-3">
                          <h3 className="text-base font-bold text-slate-900 leading-tight">
                            {mtg.title}
                          </h3>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${cfg.bg} ${cfg.border}`}>
                            {cfg.label}
                          </span>
                          {mtg.hasUnreviewedItems && (
                            <span className="text-[10px] font-black px-2 py-0.5 rounded-full bg-amber-500 text-white">
                              Pending Review
                            </span>
                          )}
                        </div>

                        <div className="flex flex-wrap items-center gap-4 text-xs text-slate-500">
                          <span className="font-semibold text-slate-700">{mtg.date}</span>
                          <span>•</span>

                          {/* Attendee Avatars */}
                          <div className="flex items-center -space-x-1.5">
                            {mtg.attendees.map((att, idx) => (
                              <div
                                key={idx}
                                className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold ring-2 ring-white ${
                                  att.name === 'Planova AI' ? 'bg-[#0E7490] text-white' : 'bg-slate-800 text-white'
                                }`}
                                title={`${att.name} (${att.role})`}
                              >
                                {att.avatar}
                              </div>
                            ))}
                          </div>

                          <span>•</span>
                          <span className="font-medium text-slate-700">
                            {mtg.extractedCount} extracted, {mtg.acceptedCount} accepted
                          </span>
                        </div>

                        <p className="text-xs text-slate-600 line-clamp-1 mt-1">
                          {mtg.summary}
                        </p>
                      </div>

                      <div className="flex items-center gap-2 flex-shrink-0">
                        <button
                          onClick={() => {
                            setActiveMeeting(mtg);
                            setDetailModal(true);
                          }}
                          className="btn-black px-3.5 py-1.5 text-xs font-bold rounded-xl"
                        >
                          Open Summary →
                        </button>

                        {isAdmin && (
                          <button
                            onClick={() => {
                              setMeetingToDelete(mtg);
                              setDeleteConfirmModal(true);
                            }}
                            className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                            title="Delete Meeting Record"
                          >
                            🗑️
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* DETAIL MODAL: Meeting Summary & Action Items */}
          {detailModal && activeMeeting && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-2xl w-full p-6 space-y-5 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-start justify-between border-b border-slate-100 pb-4">
                  <div>
                    <span className="text-[11px] font-bold text-slate-400">{activeMeeting.date}</span>
                    <h2 className="text-xl font-black text-slate-900 mt-0.5">{activeMeeting.title}</h2>
                  </div>
                  <button onClick={() => setDetailModal(false)} className="text-slate-400 hover:text-black font-bold text-lg">✕</button>
                </div>

                {/* AI Summary Card */}
                <div className="p-4 rounded-xl border border-cyan-200 bg-cyan-50/40 space-y-1">
                  <div className="flex items-center gap-1.5 text-[#0E7490] text-xs font-black">
                    <span>✦ PLANOVA AI SYNTHESIS</span>
                  </div>
                  <p className="text-xs text-slate-700 leading-relaxed">{activeMeeting.summary}</p>
                </div>

                {/* Attendees */}
                <div>
                  <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Attendees</h4>
                  <div className="flex flex-wrap gap-2">
                    {activeMeeting.attendees.map((att, idx) => (
                      <span key={idx} className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-100 text-slate-800 text-xs font-semibold">
                        <span className={`w-4 h-4 rounded-full flex items-center justify-center text-[9px] text-white ${att.name === 'Planova AI' ? 'bg-[#0E7490]' : 'bg-black'}`}>
                          {att.avatar}
                        </span>
                        {att.name} ({att.role})
                      </span>
                    ))}
                  </div>
                </div>

                {/* Extracted Action Items */}
                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider">
                    Extracted Action Items ({activeMeeting.actionItems.length})
                  </h4>
                  <div className="space-y-2">
                    {activeMeeting.actionItems.map((item, idx) => (
                      <div key={idx} className="p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between gap-3 text-xs">
                        <div>
                          <p className="font-bold text-slate-900">{item.text}</p>
                          <p className="text-[11px] text-slate-500">Owner: <strong className="text-slate-700">{item.owner}</strong></p>
                        </div>
                        <div>
                          {item.status === 'Accepted' ? (
                            <span className="text-emerald-700 font-bold px-2 py-0.5 rounded bg-emerald-50 border border-emerald-200 text-[10px]">
                              ✓ Accepted
                            </span>
                          ) : isAdmin ? (
                            <button
                              onClick={() => handleAcceptActionItem(activeMeeting.id, idx)}
                              className="btn-black px-3 py-1 rounded-lg font-bold text-xs"
                            >
                              Accept to Tasks
                            </button>
                          ) : (
                            <span className="text-amber-700 font-bold px-2 py-0.5 rounded bg-amber-50 border border-amber-200 text-[10px]">
                              Pending Review
                            </span>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex justify-end pt-3 border-t border-slate-100">
                  <button onClick={() => setDetailModal(false)} className="btn-black px-4 py-2 text-xs font-bold rounded-xl">
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ADMIN MODAL: + New Meeting */}
          {newMeetingModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-lg font-bold text-slate-900">+ Log New Meeting</h3>
                <p className="text-xs text-slate-500">
                  Paste transcript notes or bullet points. Planova AI will synthesize minutes and extract assigned tasks automatically.
                </p>

                <form onSubmit={handleCreateMeeting} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Meeting Title:</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Core Sync #5 — Final AV & Badge Dry Run"
                      value={newTitle}
                      onChange={e => setNewTitle(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-black text-slate-900"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Transcript / Discussion Notes:</label>
                    <textarea
                      rows="4"
                      placeholder="Paste conversation transcript or bullet notes here..."
                      value={newTranscript}
                      onChange={e => setNewTranscript(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium focus:ring-2 focus:ring-black text-slate-900"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNewMeetingModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isExtracting}
                      className={`btn-black px-4 py-2 text-xs font-bold rounded-xl flex items-center gap-2 ai-action-button ${isExtracting ? 'loading-action' : ''} ${toast ? 'success-action' : ''}`}
                    >
                      {isExtracting ? (
                        <>
                          <span className="animate-spin text-[#0E7490]">✦</span>
                          <span>Extracting with AI...</span>
                        </>
                      ) : (
                        <span>Save & Run AI Extraction</span>
                      )}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* DESTRUCTIVE CONFIRMATION: Delete Meeting */}
          {deleteConfirmModal && meetingToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-md w-full p-6 space-y-4 shadow-2xl border-red-200">
                <div className="flex items-center gap-2 text-red-600">
                  <span className="text-xl">⚠️</span>
                  <h3 className="text-lg font-bold">Delete Meeting Record</h3>
                </div>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Are you sure you want to delete <strong className="text-black">"{meetingToDelete.title}"</strong>? This will remove its transcript history from the event records.
                </p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setDeleteConfirmModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                    Cancel
                  </button>
                  <button onClick={handleDeleteMeeting} className="px-4 py-2 text-xs font-bold bg-red-600 hover:bg-red-700 text-white rounded-xl">
                    Confirm Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* EXPORT ALL SUMMARIES MODAL */}
          {exportModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-2xl w-full p-6 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">Consolidated Meeting Minutes Report</h3>
                    <p className="text-xs text-slate-500">Compiled for TechNova 2026 Executive Post-Event Report</p>
                  </div>
                  <button onClick={() => setExportModal(false)} className="text-slate-400 hover:text-black font-bold">✕</button>
                </div>

                <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono text-slate-800 space-y-3 whitespace-pre-wrap select-all">
                  {`# TechNova 2026 — Consolidated Meeting Minutes
Event ID: evt-1 | IEEE Student Branch
Generated: September 19, 2026

` + meetings.map((m, i) => (
`## ${i + 1}. ${m.title} (${m.date})
Attendees: ${m.attendees.map(a => a.name).join(', ')}
Status: ${m.status.toUpperCase()} (${m.acceptedCount}/${m.extractedCount} action items resolved)

Summary:
${m.summary}
`)).join('\n---\n\n')}
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => {
                      navigator.clipboard?.writeText(document.querySelector('.font-mono')?.textContent || '');
                      showToast('Copied consolidated report to clipboard!');
                    }}
                    className="px-4 py-2 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 rounded-xl"
                  >
                    Copy Markdown
                  </button>
                  <button onClick={() => setExportModal(false)} className="btn-black px-4 py-2 text-xs font-bold rounded-xl">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Navigation Sidebar Drawer */}
          {sidebarOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity" onClick={() => setSidebarOpen(false)}></div>
              <div className="fixed inset-y-0 left-0 max-w-full flex pr-10">
                <div className="w-screen max-w-xs sm:max-w-sm bg-white shadow-2xl border-r border-[#E2E8F0] flex flex-col justify-between">
                  <div>
                    <div className="p-5 border-b border-[#E2E8F0] flex items-center justify-between bg-[#F8FAFC]">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-white border border-[#E2E8F0] shadow-xs flex items-center justify-center p-1">
                          <img src="planova-logo.jpg" alt="Logo" className="w-full h-full object-contain" onError={e => { e.target.style.display='none'; e.target.parentElement.innerHTML='<span class="font-black text-black">P</span>'; }} />
                        </div>
                        <div>
                          <h3 className="text-base font-black text-black leading-tight">PLANOVA</h3>
                          <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Navigation Menu</p>
                        </div>
                      </div>
                      <button onClick={() => setSidebarOpen(false)} className="p-1.5 rounded-lg text-slate-400 hover:text-black hover:bg-slate-200 transition-colors">
                        ✕
                      </button>
                    </div>

                    <nav className="p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-160px)]">
                      <div className="px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                        Main Overview
                      </div>
                      {NAV_ITEMS.slice(0, 1).map(item => (
                        <a key={item.name} href={item.path} className="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:text-black hover:bg-slate-100 transition-all">
                          <span className="flex items-center gap-2.5">
                            <span className="text-sm">{item.icon}</span>
                            <span>{item.name}</span>
                          </span>
                          <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-bold border border-slate-200">
                            {item.badge}
                          </span>
                        </a>
                      ))}

                      <div className="pt-4 px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                        Admin Core Modules
                      </div>
                      {NAV_ITEMS.slice(1).map(item => (
                        <a
                          key={item.name}
                          href={item.path}
                          className={`flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                            item.active ? 'bg-black text-white shadow-xs' : 'text-slate-700 hover:text-black hover:bg-slate-100'
                          }`}
                        >
                          <span className="flex items-center gap-2.5">
                            <span className="text-sm">{item.icon}</span>
                            <span>{item.name}</span>
                          </span>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-extrabold ${
                            item.active ? 'bg-slate-800 text-slate-200' : 'bg-slate-100 text-slate-600 border border-slate-200'
                          }`}>
                            {item.badge}
                          </span>
                        </a>
                      ))}
                    </nav>
                  </div>

                  <div className="p-4 border-t border-[#E2E8F0] bg-[#F8FAFC] flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center">
                        J
                      </div>
                      <div>
                        <p className="text-xs font-bold text-black leading-tight">Jenish</p>
                        <p className="text-[10px] font-extrabold text-slate-500 uppercase">{isAdmin ? 'President (Admin)' : 'Member'}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2 animate-bounce border border-slate-700">
              <span className="text-emerald-400">✓</span>
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<MeetingsApp />, document.getElementById('root'));
  </script>
</body>
</html>
