<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements — Planova Admin</title>
  <meta name="description" content="AI multi-channel broadcast generator, administrative review, and sent history for Planova campus clubs.">
  <link rel="icon" type="image/jpeg" href="planova-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: '#4F46E5',
            ai: '#0E7490',
            'status-todo': '#94A3B8',
            'status-doing': '#2563EB',
            'status-blocked': '#DC2626',
            'status-review': '#D97706',
            'status-done': '#059669',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F8FAFC;
      color: #0F1729;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .clean-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      transition: box-shadow 150ms ease, border-color 150ms ease;
    }
    .clean-card:hover {
      border-color: #CBD5E1;
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06);
    }
    .btn-black {
      background-color: #000000;
      color: #FFFFFF;
      transition: background-color 150ms ease;
    }
    .btn-black:hover {
      background-color: #1E293B;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const INITIAL_ANNOUNCEMENTS = [
      {
        id: 'ann-1',
        subject: 'TechNova 2026 Registration is Now Open!',
        purpose: 'Registration Open',
        audience: 'All Students & Campuses',
        channels: ['Email', 'Instagram', 'WhatsApp'],
        sentBy: 'Jenish (President)',
        date: 'Sep 10, 2026',
        status: 'Sent',
        body: 'Registration is officially live for TechNova Hackathon 2026! 36 hours of hacking, $10k in prize tracks, and direct mentoring from top tech leaders. RSVP today.',
        variants: {
          Email: 'Subject: TechNova 2026 Registration is Open!\n\nDear Students,\n\nWe are thrilled to announce that applications for TechNova 2026 are officially open. Join over 350 student hackers for 36 hours of building.',
          Instagram: '🚀 TechNova 2026 APPLICATIONS LIVE NOW! Link in bio to apply before slots fill up. 💻🔥 #TechNova #Hackathon',
          WhatsApp: '📢 *TechNova 2026 Registration is Open!* 🚀\nApply now at: https://technova.campus.edu\nLimited seats for teams.'
        }
      },
      {
        id: 'ann-2',
        subject: 'Keynote Speaker Announcement: Dr. Aris Thorne',
        purpose: 'Speaker Reveal',
        audience: 'Registered Attendees',
        channels: ['Instagram', 'Notice Board', 'WhatsApp'],
        sentBy: 'Neha Sharma (Marketing)',
        date: 'Sep 14, 2026',
        status: 'Sent',
        body: 'Proud to announce Dr. Aris Thorne, Principal Research Scientist in Distributed AI, will deliver this year’s opening keynote on Agentic Machine Systems.',
        variants: {
          Instagram: '✦ KEYNOTE REVEAL: Welcoming Dr. Aris Thorne to TechNova 2026! 🤖✨',
          WhatsApp: '🎙️ *Keynote Speaker Announcement:* Dr. Aris Thorne will speak on Autonomous AI at the opening ceremony.',
          'Notice Board': 'TechNova 2026 Keynote: Dr. Aris Thorne, Friday 10:00 AM Main Auditorium.'
        }
      },
      {
        id: 'ann-3',
        subject: 'Urgent: Submit Team Dietary Requirements by Friday',
        purpose: 'Deadline Warning',
        audience: 'Accepted Hackers',
        channels: ['Email', 'WhatsApp'],
        sentBy: 'Jenish (President)',
        date: 'Sep 17, 2026',
        status: 'Sent',
        body: 'To ensure catering handles vegetarian, vegan, and halal meals properly, all accepted hackers must update meal profiles in the portal.',
        variants: {
          Email: 'Please confirm dietary specifications before food counts lock with catering.',
          WhatsApp: '⚠️ *Reminder:* Update meal dietary preferences on your hacker dashboard.'
        }
      },
      {
        id: 'ann-4',
        subject: 'Volunteer Briefing & Walkthrough Tomorrow 5 PM',
        purpose: 'Operational Sync',
        audience: 'Volunteers Only',
        channels: ['WhatsApp', 'Email'],
        sentBy: 'Rohan Jha (Operations)',
        date: 'Sep 18, 2026',
        status: 'Sent',
        body: 'Mandatory dry run for check-in desks, badges, and auditorium egress paths tomorrow at 5 PM in Room 204.',
        variants: {
          WhatsApp: '👥 *Volunteer Dry Run Reminder:* Room 204 tomorrow at 5 PM. Attendance mandatory for shift wristbands.',
          Email: 'All volunteers must attend the 45-minute orientation tomorrow at 5 PM.'
        }
      }
    ];

    const NAV_ITEMS = [
      { name: 'Dashboard', path: 'dashboard.html', icon: '📊', badge: 'Home' },
      { name: 'Tasks', path: 'tasks.html', icon: '📋', badge: '68 Total' },
      { name: 'Volunteers', path: 'volunteers.html', icon: '👥', badge: '22 Members' },
      { name: 'Meetings', path: 'meetings.html', icon: '🎙️', badge: '9 Meetings' },
      { name: 'Deadlines', path: 'deadlines.html', icon: '⏰', badge: '5 This Week' },
      { name: 'Document Review', path: 'documents-review.html', icon: '📄', badge: '2 Pending' },
      { name: 'Risks', path: 'risks.html', icon: '⚠️', badge: '1 Critical' },
      { name: 'Announcements', path: 'announcements.html', icon: '📢', active: true, badge: '12 Sent' },
      { name: 'Knowledge Base', path: 'knowledge.html', icon: '🧠', badge: '24 Docs' }
    ];

    const CHANNELS_LIST = ['Email', 'WhatsApp', 'Instagram', 'Notice Board'];

    function AnnouncementsApp() {
      const isAdmin = true;
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [loading, setLoading] = useState(true);

      const [tab, setTab] = useState('compose'); // 'compose' | 'history'
      const [history, setHistory] = useState(INITIAL_ANNOUNCEMENTS);

      // Form State
      const [purpose, setPurpose] = useState('Registration Open');
      const [audience, setAudience] = useState('All Attendees');
      const [tone, setTone] = useState('Enthusiastic & High Energy');
      const [selectedChannels, setSelectedChannels] = useState(['Email', 'WhatsApp', 'Instagram']);
      const [customContext, setCustomContext] = useState('');

      // AI Generation State
      const [isGenerating, setIsGenerating] = useState(false);
      const [generatedVariants, setGeneratedVariants] = useState(null);

      // Modals
      const [viewHistoryModal, setViewHistoryModal] = useState(false);
      const [selectedHistoryItem, setSelectedHistoryItem] = useState(null);

      // Toast
      const [toast, setToast] = useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        const timer = setTimeout(() => setLoading(false), 400);
        return () => clearTimeout(timer);
      }, []);

      const toggleChannel = (ch) => {
        setSelectedChannels(prev => {
          if (prev.includes(ch)) {
            if (prev.length === 1) return prev; // keep at least 1
            return prev.filter(c => c !== ch);
          }
          return [...prev, ch];
        });
      };

      // AI Generation simulation
      const handleGenerateAI = () => {
        setIsGenerating(true);
        setTimeout(() => {
          const variants = {};
          selectedChannels.forEach(ch => {
            if (ch === 'Email') {
              variants[ch] = {
                subject: `TechNova 2026: ${purpose} Update`,
                body: `Dear ${audience},\n\nWe are excited to share an important update regarding TechNova 2026. ${customContext || 'Everything is progressing smoothly and our teams are preparing for an unprecedented hackathon experience.'}\n\nPlease check your portal dashboard for further details.\n\nWarm regards,\nPlanova Executive Board`
              };
            } else if (ch === 'WhatsApp') {
              variants[ch] = {
                subject: `*TechNova 2026 Update*`,
                body: `📢 *TechNova 2026 Announcement*\n\nTarget: ${audience}\nPurpose: ${purpose}\n\n${customContext || 'Hackathon preparations are full steam ahead! Stay tuned for agenda updates.'}\n\n👉 Details: https://technova.campus.edu`
              };
            } else if (ch === 'Instagram') {
              variants[ch] = {
                subject: 'Instagram Caption & Story Copy',
                body: `⚡ TechNova 2026 Alert! ${customContext || 'Big things happening on campus! Tag your squad and get ready.'} 🔥🚀\n\n#TechNova2026 #IEEE #StudentHackers #CampusInnovation`
              };
            } else if (ch === 'Notice Board') {
              variants[ch] = {
                subject: 'Campus Printed Notice',
                body: `NOTICE: TechNova 2026 — ${purpose}\nDate of Event: October 15, 2026\nAudience: ${audience}\n${customContext || 'Please visit Student Activity Center Room 204 for physical inquiries.'}`
              };
            }
          });
          setGeneratedVariants(variants);
          setIsGenerating(false);
          showToast('✦ Multi-channel announcements drafted by Planova AI!');
        }, 1100);
      };

      const handleUpdateVariantBody = (channel, newBody) => {
        setGeneratedVariants(prev => ({
          ...prev,
          [channel]: { ...prev[channel], body: newBody }
        }));
      };

      const handleApproveAndSend = () => {
        if (!generatedVariants) return;
        const newRecord = {
          id: `ann-${Date.now()}`,
          subject: generatedVariants.Email?.subject || `TechNova 2026: ${purpose}`,
          purpose,
          audience,
          channels: selectedChannels,
          sentBy: 'Jenish (President)',
          date: 'Today, Just now',
          status: 'Sent',
          body: generatedVariants[selectedChannels[0]]?.body || 'Broadcast dispatched.',
          variants: Object.fromEntries(
            Object.entries(generatedVariants).map(([k, v]) => [k, v.body])
          )
        };
        setHistory(prev => [newRecord, ...prev]);
        setGeneratedVariants(null);
        setCustomContext('');
        setTab('history');
        showToast('🚀 Broadcast approved and dispatched across all selected channels!');
      };

      const handleResendReminder = (item) => {
        showToast(`⚡ Dispatched instant reminder for "${item.subject}" to ${item.audience}!`);
      };

      return (
        <div className="min-h-screen bg-[#F8FAFC]">
          {/* Top Bar */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-[#E2E8F0] px-4 sm:px-8 py-3 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-3 sm:gap-4">
              <button
                onClick={() => setSidebarOpen(true)}
                className="p-2 -ml-1 text-slate-700 hover:text-black hover:bg-slate-100 rounded-xl transition-colors flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-black"
                title="Open Navigation Menu"
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <span className="hidden md:inline text-xs font-bold text-slate-800">Modules</span>
              </button>

              <a href="dashboard.html" className="flex items-center gap-3 group">
                <div className="w-10 h-10 rounded-xl bg-white border border-[#E2E8F0] shadow-xs flex items-center justify-center p-1 flex-shrink-0">
                  <img src="planova-logo.jpg" alt="Logo" className="w-full h-full object-contain" onError={e => { e.target.style.display='none'; e.target.parentElement.innerHTML='<span class="font-black text-black">P</span>'; }} />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xl font-black tracking-tight text-black leading-none">PLANOVA</span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-black border border-slate-300">
                      TechNova 2026
                    </span>
                  </div>
                  <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block mt-0.5">
                    Announcements Hub
                  </span>
                </div>
              </a>
            </div>

            <div className="flex items-center gap-3">
              <a
                href="student-announcements.html"
                className="hidden sm:inline-flex items-center gap-1.5 text-xs font-bold text-[#4F46E5] bg-[#EEF2FF] hover:bg-[#DCE3FF] px-3 py-1.5 rounded-xl transition-colors border border-[#C7D2FE]"
              >
                <span>Student Feed →</span>
              </a>
              <a
                href="dashboard.html"
                className="hidden sm:inline-flex items-center gap-1.5 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl transition-colors border border-slate-200"
              >
                ← Dashboard
              </a>

              {/* Profile with President Role */}
              <div className="flex items-center gap-2.5 pl-3 border-l border-slate-200">
                <div className="relative flex-shrink-0">
                  <div className="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center shadow-xs">
                    J
                  </div>
                  <span className="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white" title="Online"></span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-extrabold text-black leading-tight">Jenish</span>
                  <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-black tracking-wide uppercase bg-black text-white shadow-xs">
                    President
                  </span>
                </div>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-6">
            {/* Breadcrumb */}
            <nav className="flex items-center gap-2 text-xs font-semibold text-slate-500">
              <a href="dashboard.html" className="hover:text-black transition-colors">Dashboard</a>
              <span>/</span>
              <span className="text-black font-bold">Announcements</span>
            </nav>

            {/* PAGE HEADER PATTERN: [Bold page title] [light-gray count/status pill] + subtitle */}
            <div className="clean-card p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-3">
                  <h1 className="text-2xl sm:text-3xl font-black text-[#0F1729] tracking-tight">
                    Announcements
                  </h1>
                  <span className="text-xs font-bold px-3 py-1 rounded-full bg-slate-100 text-slate-800 border border-slate-200">
                    12 sent
                  </span>
                </div>
                <p className="text-xs sm:text-sm text-slate-500 mt-1">
                  Drafted by AI, approved by you, broadcast across all campus club channels.
                </p>
              </div>

              {/* Tab Switcher */}
              <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs">
                <button
                  onClick={() => setTab('compose')}
                  className={`px-4 py-2 rounded-lg font-bold transition-all ${
                    tab === 'compose' ? 'bg-black text-white shadow-xs' : 'text-slate-600 hover:text-black'
                  }`}
                >
                  Compose New
                </button>
                <button
                  onClick={() => setTab('history')}
                  className={`px-4 py-2 rounded-lg font-bold transition-all ${
                    tab === 'history' ? 'bg-black text-white shadow-xs' : 'text-slate-600 hover:text-black'
                  }`}
                >
                  History ({history.length})
                </button>
              </div>
            </div>

            {/* SKELETON */}
            {loading ? (
              <div className="clean-card p-6 space-y-4">
                {[...Array(4)].map((_, i) => (
                  <div key={i} className="h-16 bg-slate-100 rounded-xl animate-pulse"></div>
                ))}
              </div>
            ) : tab === 'compose' ? (
              /* TAB 1: COMPOSE NEW */
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                {/* Left Form: Parameters */}
                <div className="lg:col-span-5 clean-card p-6 space-y-4">
                  <div className="pb-3 border-b border-slate-100">
                    <h3 className="text-base font-bold text-slate-900">Broadcast Parameters</h3>
                    <p className="text-xs text-slate-500">Configure audience and purpose for automated AI tailoring</p>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Announcement Purpose:</label>
                    <select
                      value={purpose}
                      onChange={e => setPurpose(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-black cursor-pointer"
                    >
                      <option value="Registration Open">Registration Open</option>
                      <option value="Speaker Reveal">Speaker Reveal</option>
                      <option value="Deadline Warning">Deadline Warning</option>
                      <option value="Hackathon Kickoff">Hackathon Kickoff</option>
                      <option value="Venue & Room Shift">Venue & Room Shift</option>
                      <option value="Post-Event Thanks">Post-Event Thanks</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Target Audience:</label>
                    <select
                      value={audience}
                      onChange={e => setAudience(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-black cursor-pointer"
                    >
                      <option value="All Attendees">All Attendees (350 hackers)</option>
                      <option value="Accepted Hackers">Accepted Hackers Only</option>
                      <option value="Volunteers Only">Volunteers Only (22 members)</option>
                      <option value="Sponsors">Sponsors & Corporate Mentors</option>
                      <option value="Core Team">Core Team Leadership</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Editorial Tone:</label>
                    <select
                      value={tone}
                      onChange={e => setTone(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-black cursor-pointer"
                    >
                      <option value="Enthusiastic & High Energy">Enthusiastic & High Energy</option>
                      <option value="Direct & Urgent">Direct & Urgent (Action required)</option>
                      <option value="Professional & Formal">Professional & Formal</option>
                      <option value="Casual & Community-focused">Casual & Community-focused</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-2">Target Channels:</label>
                    <div className="grid grid-cols-2 gap-2">
                      {CHANNELS_LIST.map(ch => (
                        <button
                          type="button"
                          key={ch}
                          onClick={() => toggleChannel(ch)}
                          className={`flex items-center gap-2 p-2.5 rounded-xl border text-xs font-bold transition-all ${
                            selectedChannels.includes(ch)
                              ? 'bg-black text-white border-black shadow-xs'
                              : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                          }`}
                        >
                          <span>{selectedChannels.includes(ch) ? '✓' : '+'}</span>
                          <span>{ch}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Additional Context / Bullet Points:</label>
                    <textarea
                      rows="3"
                      value={customContext}
                      onChange={e => setCustomContext(e.target.value)}
                      placeholder="e.g. Include note about registration deadline closing at midnight Friday; mention food preferences..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium focus:ring-2 focus:ring-black text-slate-900"
                    ></textarea>
                  </div>

                  {isAdmin ? (
                    <button
                      onClick={handleGenerateAI}
                      disabled={isGenerating}
                      className="w-full py-3 rounded-xl font-bold text-xs text-white bg-[#0E7490] hover:bg-[#0c627a] transition-all shadow-xs flex items-center justify-center gap-2"
                    >
                      {isGenerating ? (
                        <>
                          <span className="animate-spin">✦</span>
                          <span>Synthesizing Tailored Channel Drafts...</span>
                        </>
                      ) : (
                        <>
                          <span>✦ Generate Multi-Channel Drafts with AI</span>
                        </>
                      )}
                    </button>
                  ) : (
                    <div className="p-3 bg-amber-50 rounded-xl text-xs text-amber-900 font-medium">
                      🔒 Only administrators can generate and dispatch announcements.
                    </div>
                  )}
                </div>

                {/* Right Area: Generated Channel Previews */}
                <div className="lg:col-span-7 space-y-4">
                  {generatedVariants ? (
                    <div className="space-y-4">
                      <div className="flex items-center justify-between pb-2 border-b border-slate-200">
                        <div className="flex items-center gap-2">
                          <span className="text-[#0E7490] font-black text-xs">✦ PLANOVA AI MULTI-CHANNEL VARIANTS</span>
                          <span className="text-[10px] bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-full border border-slate-200">
                            Editable Inline
                          </span>
                        </div>
                        {isAdmin && (
                          <button
                            onClick={handleApproveAndSend}
                            className="btn-black px-4 py-2 text-xs font-bold rounded-xl shadow-md"
                          >
                            Approve & Send All Channels →
                          </button>
                        )}
                      </div>

                      {selectedChannels.map(ch => {
                        const variant = generatedVariants[ch];
                        if (!variant) return null;

                        return (
                          <div key={ch} className="clean-card p-5 space-y-3">
                            <div className="flex items-center justify-between">
                              <span className="text-xs font-black uppercase tracking-wider text-slate-900 flex items-center gap-1.5">
                                <span className="w-2 h-2 rounded-full bg-[#0E7490]"></span>
                                {ch} Preview
                              </span>
                              <span className="text-[10px] font-bold text-slate-400">
                                Click text to edit before approving
                              </span>
                            </div>

                            {variant.subject && (
                              <div>
                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">Subject Line:</label>
                                <input
                                  type="text"
                                  value={variant.subject}
                                  onChange={e => {
                                    const sub = e.target.value;
                                    setGeneratedVariants(p => ({
                                      ...p,
                                      [ch]: { ...p[ch], subject: sub }
                                    }));
                                  }}
                                  className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-black"
                                />
                              </div>
                            )}

                            <div>
                              <label className="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">Body Message:</label>
                              <textarea
                                rows="4"
                                value={variant.body}
                                onChange={e => handleUpdateVariantBody(ch, e.target.value)}
                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800 leading-relaxed focus:ring-2 focus:ring-black"
                              ></textarea>
                            </div>
                          </div>
                        );
                      })}

                      {isAdmin && (
                        <div className="pt-2 flex justify-end">
                          <button
                            onClick={handleApproveAndSend}
                            className="btn-black px-5 py-3 text-xs font-bold rounded-xl shadow-lg flex items-center gap-2"
                          >
                            <span>🚀 Approve & Broadcast {selectedChannels.length} Announcements</span>
                          </button>
                        </div>
                      )}
                    </div>
                  ) : (
                    /* Initial prompt placeholder */
                    <div className="clean-card p-12 text-center text-slate-400 space-y-3">
                      <div className="w-12 h-12 rounded-full bg-cyan-50 text-[#0E7490] flex items-center justify-center mx-auto text-xl font-bold">
                        ✦
                      </div>
                      <h3 className="text-sm font-bold text-slate-900">No Drafts Generated Yet</h3>
                      <p className="text-xs text-slate-500 max-w-sm mx-auto">
                        Choose your target audience and channels on the left, then click <strong>Generate with AI</strong>. Each channel will receive tone-adapted formatting ready for admin approval.
                      </p>
                    </div>
                  )}
                </div>
              </div>
            ) : (
              /* TAB 2: HISTORY */
              <div className="clean-card overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider text-[10px]">
                      <tr>
                        <th className="p-4">Subject / Purpose</th>
                        <th className="p-4">Audience</th>
                        <th className="p-4">Channels Sent</th>
                        <th className="p-4">Sent By</th>
                        <th className="p-4">Date</th>
                        <th className="p-4">Status</th>
                        <th className="p-4 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {history.map(item => (
                        <tr key={item.id} className="hover:bg-slate-50/70 transition-colors">
                          <td className="p-4 max-w-xs">
                            <p className="font-bold text-slate-900 leading-tight">{item.subject}</p>
                            <p className="text-[11px] text-slate-400 mt-0.5">{item.purpose}</p>
                          </td>
                          <td className="p-4 font-semibold text-slate-700">{item.audience}</td>
                          <td className="p-4">
                            <div className="flex flex-wrap gap-1">
                              {item.channels.map(ch => (
                                <span key={ch} className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200">
                                  {ch}
                                </span>
                              ))}
                            </div>
                          </td>
                          <td className="p-4 text-slate-600 font-medium">{item.sentBy}</td>
                          <td className="p-4 text-slate-500 font-medium">{item.date}</td>
                          <td className="p-4">
                            <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200">
                              ✓ {item.status}
                            </span>
                          </td>
                          <td className="p-4 text-right">
                            <div className="inline-flex items-center gap-2">
                              <button
                                onClick={() => {
                                  setSelectedHistoryItem(item);
                                  setViewHistoryModal(true);
                                }}
                                className="px-2.5 py-1 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors border border-slate-200"
                              >
                                View
                              </button>

                              {isAdmin && (
                                <button
                                  onClick={() => handleResendReminder(item)}
                                  className="px-2.5 py-1 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors border border-slate-200"
                                  title="Resend this announcement as a reminder"
                                >
                                  Re-send Reminder
                                </button>
                              )}
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* VIEW HISTORY ITEM MODAL */}
          {viewHistoryModal && selectedHistoryItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-xl w-full p-6 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
                <div className="flex items-start justify-between border-b border-slate-100 pb-3">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400">{selectedHistoryItem.date} • Sent by {selectedHistoryItem.sentBy}</span>
                    <h3 className="text-lg font-black text-slate-900">{selectedHistoryItem.subject}</h3>
                  </div>
                  <button onClick={() => setViewHistoryModal(false)} className="text-slate-400 hover:text-black font-bold">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <span className="font-bold text-slate-500 uppercase">Target Audience:</span>
                    <p className="font-semibold text-slate-800">{selectedHistoryItem.audience}</p>
                  </div>

                  <div>
                    <span className="font-bold text-slate-500 uppercase">Channels Dispatched:</span>
                    <div className="flex gap-1.5 mt-1">
                      {selectedHistoryItem.channels.map(c => (
                        <span key={c} className="px-2 py-0.5 rounded bg-slate-100 text-slate-800 font-bold border border-slate-200">
                          {c}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-2 pt-2">
                    <span className="font-bold text-slate-500 uppercase">Channel Payloads:</span>
                    {Object.entries(selectedHistoryItem.variants || {}).map(([ch, bodyText]) => (
                      <div key={ch} className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                        <span className="font-bold text-slate-900 text-[11px] block">{ch}:</span>
                        <p className="text-slate-700 whitespace-pre-wrap">{bodyText}</p>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex justify-end pt-2">
                  <button onClick={() => setViewHistoryModal(false)} className="btn-black px-4 py-2 text-xs font-bold rounded-xl">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Navigation Sidebar Drawer */}
          {sidebarOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity" onClick={() => setSidebarOpen(false)}></div>
              <div className="fixed inset-y-0 left-0 max-w-full flex pr-10">
                <div className="w-screen max-w-xs sm:max-w-sm bg-white shadow-2xl border-r border-[#E2E8F0] flex flex-col justify-between">
                  <div>
                    <div className="p-5 border-b border-[#E2E8F0] flex items-center justify-between bg-[#F8FAFC]">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-white border border-[#E2E8F0] shadow-xs flex items-center justify-center p-1">
                          <img src="planova-logo.jpg" alt="Logo" className="w-full h-full object-contain" onError={e => { e.target.style.display='none'; e.target.parentElement.innerHTML='<span class="font-black text-black">P</span>'; }} />
                        </div>
                        <div>
                          <h3 className="text-base font-black text-black leading-tight">PLANOVA</h3>
                          <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Navigation Menu</p>
                        </div>
                      </div>
                      <button onClick={() => setSidebarOpen(false)} className="p-1.5 rounded-lg text-slate-400 hover:text-black hover:bg-slate-200 transition-colors">
                        ✕
                      </button>
                    </div>

                    <nav className="p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-160px)]">
                      <div className="px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                        Main Overview
                      </div>
                      {NAV_ITEMS.slice(0, 1).map(item => (
                        <a key={item.name} href={item.path} className="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:text-black hover:bg-slate-100 transition-all">
                          <span className="flex items-center gap-2.5">
                            <span className="text-sm">{item.icon}</span>
                            <span>{item.name}</span>
                          </span>
                          <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-bold border border-slate-200">
                            {item.badge}
                          </span>
                        </a>
                      ))}

                      <div className="pt-4 px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                        Admin Core Modules
                      </div>
                      {NAV_ITEMS.slice(1).map(item => (
                        <a
                          key={item.name}
                          href={item.path}
                          className={`flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                            item.active ? 'bg-black text-white shadow-xs' : 'text-slate-700 hover:text-black hover:bg-slate-100'
                          }`}
                        >
                          <span className="flex items-center gap-2.5">
                            <span className="text-sm">{item.icon}</span>
                            <span>{item.name}</span>
                          </span>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-extrabold ${
                            item.active ? 'bg-slate-800 text-slate-200' : 'bg-slate-100 text-slate-600 border border-slate-200'
                          }`}>
                            {item.badge}
                          </span>
                        </a>
                      ))}
                    </nav>
                  </div>

                  <div className="p-4 border-t border-[#E2E8F0] bg-[#F8FAFC] flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center">
                        J
                      </div>
                      <div>
                        <p className="text-xs font-bold text-black leading-tight">Jenish</p>
                        <p className="text-[10px] font-extrabold text-slate-500 uppercase">{isAdmin ? 'President (Admin)' : 'Member'}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2 animate-bounce border border-slate-700">
              <span className="text-emerald-400">✓</span>
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<AnnouncementsApp />, document.getElementById('root'));
  </script>
</body>
</html>
