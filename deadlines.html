<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadlines — Planova Admin</title>
  <meta name="description" content="Cross-module deadlines timeline aggregated across tasks, documents, and meetings for Planova campus club events.">
  <link rel="icon" type="image/jpeg" href="planova-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: '#4F46E5',
            ai: '#0E7490',
            'status-todo': '#94A3B8',
            'status-doing': '#2563EB',
            'status-blocked': '#DC2626',
            'status-review': '#D97706',
            'status-done': '#059669',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F8FAFC;
      color: #0F1729;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .clean-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      transition: box-shadow 150ms ease, border-color 150ms ease;
    }
    .clean-card:hover {
      border-color: #CBD5E1;
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06);
    }
    .btn-black {
      background-color: #000000;
      color: #FFFFFF;
      transition: background-color 150ms ease;
    }
    .btn-black:hover {
      background-color: #1E293B;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const EVENT_DATE = '2026-10-15'; // TechNova Hackathon 2026 Main Event Date

    const INITIAL_DEADLINES = [
      { id: 'dl-1', type: 'document', title: 'Auditorium Permission Letter (Dean Approval)', owner: 'Rohan Jha', dueAt: '2026-09-18', overdue: true, group: 'Today' },
      { id: 'dl-2', type: 'task', title: 'Power strip & high-amp breaker allocation for 60 teams', owner: 'Priya Patel', dueAt: '2026-09-19', overdue: false, group: 'Today' },
      { id: 'dl-3', type: 'document', title: 'Sponsorship Pitch Deck & Tier Sheet sign-off', owner: 'Dev Malik', dueAt: '2026-09-20', overdue: false, group: 'Tomorrow' },
      { id: 'dl-4', type: 'meeting', title: 'Core Sync #4 action item: reserve backup amplifier', owner: 'Priya Patel', dueAt: '2026-09-21', overdue: false, group: 'This week' },
      { id: 'dl-5', type: 'task', title: 'Opening keynote speaker agreement & green-room logistics', owner: 'Kavya Sen', dueAt: '2026-09-22', overdue: false, group: 'This week' },
      { id: 'dl-6', type: 'document', title: 'Campus Safety & EMT Medical Coverage Certificate', owner: 'Tanvi Gaikwad', dueAt: '2026-09-24', overdue: false, group: 'This week' },
      { id: 'dl-7', type: 'task', title: 'Print campus signage banners and stage backdrops', owner: 'Neha Sharma', dueAt: '2026-09-25', overdue: false, group: 'This week' },
      { id: 'dl-8', type: 'meeting', title: 'Sponsorship sync follow-up: banner eyelet specifications', owner: 'Neha Sharma', dueAt: '2026-09-27', overdue: false, group: 'Next week' },
      { id: 'dl-9', type: 'task', title: 'Order badges, lanyard tags, and volunteer t-shirts', owner: 'Rohan Jha', dueAt: '2026-09-29', overdue: false, group: 'Next week' },
      { id: 'dl-10', type: 'document', title: 'Judges Evaluation Scorecards & NDAs', owner: 'Arjun Rao', dueAt: '2026-10-02', overdue: false, group: 'Next week' },
      { id: 'dl-11', type: 'task', title: 'Final stage dry-run and network load testing', owner: 'Arjun Rao', dueAt: '2026-10-10', overdue: false, group: 'Later' }
    ];

    const NAV_ITEMS = [
      { name: 'Dashboard', path: 'dashboard.html', icon: '📊', badge: 'Home' },
      { name: 'Tasks', path: 'tasks.html', icon: '📋', badge: '68 Total' },
      { name: 'Volunteers', path: 'volunteers.html', icon: '👥', badge: '22 Members' },
      { name: 'Meetings', path: 'meetings.html', icon: '🎙️', badge: '9 Meetings' },
      { name: 'Deadlines', path: 'deadlines.html', icon: '⏰', active: true, badge: '5 This Week' },
      { name: 'Document Review', path: 'documents-review.html', icon: '📄', badge: '2 Pending' },
      { name: 'Risks', path: 'risks.html', icon: '⚠️', badge: '1 Critical' },
      { name: 'Announcements', path: 'announcements.html', icon: '📢', badge: '12 Sent' },
      { name: 'Knowledge Base', path: 'knowledge.html', icon: '🧠', badge: '24 Docs' }
    ];

    const TYPE_STYLES = {
      task: { label: 'Task', color: '#2563EB', bg: 'bg-blue-50 text-blue-700 border-blue-200', icon: '📋' },
      document: { label: 'Document', color: '#7C3AED', bg: 'bg-purple-50 text-purple-700 border-purple-200', icon: '📄' },
      meeting: { label: 'Meeting', color: '#059669', bg: 'bg-emerald-50 text-emerald-700 border-emerald-200', icon: '🎙️' }
    };

    function DeadlinesApp() {
      const isAdmin = true;
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [loading, setLoading] = useState(true);

      const [deadlines, setDeadlines] = useState(INITIAL_DEADLINES);
      const [view, setView] = useState('list'); // 'week' | 'calendar' | 'list'
      const [selectedDayDeadlines, setSelectedDayDeadlines] = useState(null);
      const [selectedDateString, setSelectedDateString] = useState('');

      // Modals
      const [nudgeModal, setNudgeModal] = useState(false);
      const [rescheduleModal, setRescheduleModal] = useState(false);
      const [itemToReschedule, setItemToReschedule] = useState(null);
      const [newDueDate, setNewDueDate] = useState('');
      const [showEventDateWarning, setShowEventDateWarning] = useState(false);

      // Toast
      const [toast, setToast] = useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        const timer = setTimeout(() => setLoading(false), 400);
        return () => clearTimeout(timer);
      }, []);

      // Calculate days remaining
      const getDaysRemaining = (dueAtStr) => {
        const today = new Date('2026-09-19T00:00:00');
        const due = new Date(`${dueAtStr}T00:00:00`);
        const diffTime = due - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays;
      };

      // Filter by range
      const displayDeadlines = useMemo(() => {
        if (view === 'week') {
          return deadlines.filter(d => ['Today', 'Tomorrow', 'This week'].includes(d.group));
        }
        return deadlines;
      }, [deadlines, view]);

      // Nudge Action
      const handleNudgeEveryone = () => {
        const thisWeekCount = deadlines.filter(d => ['Today', 'Tomorrow', 'This week'].includes(d.group)).length;
        showToast(`⚡ Batch reminder sent to ${thisWeekCount} deadline assignees via Email & WhatsApp!`);
        setNudgeModal(false);
      };

      // Reschedule Action
      const handleOpenReschedule = (item) => {
        setItemToReschedule(item);
        setNewDueDate(item.dueAt);
        setShowEventDateWarning(new Date(item.dueAt) > new Date(EVENT_DATE));
        setRescheduleModal(true);
      };

      const handleDateChange = (val) => {
        setNewDueDate(val);
        setShowEventDateWarning(new Date(val) > new Date(EVENT_DATE));
      };

      const handleConfirmReschedule = () => {
        if (!itemToReschedule || !newDueDate) return;
        setDeadlines(prev => prev.map(d => {
          if (d.id === itemToReschedule.id) {
            const daysRem = getDaysRemaining(newDueDate);
            let grp = 'Later';
            if (daysRem < 0) grp = 'Overdue';
            else if (daysRem === 0) grp = 'Today';
            else if (daysRem === 1) grp = 'Tomorrow';
            else if (daysRem <= 7) grp = 'This week';
            else if (daysRem <= 14) grp = 'Next week';

            return {
              ...d,
              dueAt: newDueDate,
              overdue: daysRem < 0,
              group: grp
            };
          }
          return d;
        }));

        showToast(`Rescheduled "${itemToReschedule.title}" to ${newDueDate}.`);
        setRescheduleModal(false);
        setItemToReschedule(null);
      };

      // Grouped for list view
      const groupedDeadlines = useMemo(() => {
        const groups = {
          'Today': [],
          'Tomorrow': [],
          'This week': [],
          'Next week': [],
          'Later': []
        };
        displayDeadlines.forEach(d => {
          if (groups[d.group]) groups[d.group].push(d);
          else groups['Later'].push(d);
        });
        return groups;
      }, [displayDeadlines]);

      // Calendar month setup (September 2026)
      const calendarDays = useMemo(() => {
        const days = [];
        // Sept 1, 2026 is a Tuesday (padding 1 empty box for Monday)
        for (let i = 0; i < 1; i++) days.push({ day: null });
        for (let i = 1; i <= 30; i++) {
          const dateStr = `2026-09-${String(i).padStart(2, '0')}`;
          const dayItems = deadlines.filter(d => d.dueAt === dateStr);
          days.push({ day: i, dateStr, items: dayItems });
        }
        return days;
      }, [deadlines]);

      return (
        <div className="min-h-screen bg-[#F8FAFC]">
          {/* Top Bar */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-[#E2E8F0] px-4 sm:px-8 py-3 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-3 sm:gap-4">
              <button
                onClick={() => setSidebarOpen(true)}
                className="p-2 -ml-1 text-slate-700 hover:text-black hover:bg-slate-100 rounded-xl transition-colors flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-black"
                title="Open Navigation Menu"
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <span className="hidden md:inline text-xs font-bold text-slate-800">Modules</span>
              </button>

              <a href="dashboard.html" className="flex items-center gap-3 group">
                <div className="w-10 h-10 rounded-xl bg-white border border-[#E2E8F0] shadow-xs flex items-center justify-center p-1 flex-shrink-0">
                  <img src="planova-logo.jpg" alt="Logo" className="w-full h-full object-contain" onError={e => { e.target.style.display='none'; e.target.parentElement.innerHTML='<span class="font-black text-black">P</span>'; }} />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xl font-black tracking-tight text-black leading-none">PLANOVA</span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-black border border-slate-300">
                      TechNova 2026
                    </span>
                  </div>
                  <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block mt-0.5">
                    Unified Deadlines Horizon
                  </span>
                </div>
              </a>
            </div>

            <div className="flex items-center gap-3">
              <a
                href="dashboard.html"
                className="hidden sm:inline-flex items-center gap-1.5 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl transition-colors border border-slate-200"
              >
                ← Dashboard
              </a>

              {/* Profile with President Role */}
              <div className="flex items-center gap-2.5 pl-3 border-l border-slate-200">
                <div className="relative flex-shrink-0">
                  <div className="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center shadow-xs">
                    J
                  </div>
                  <span className="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white" title="Online"></span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-extrabold text-black leading-tight">Jenish</span>
                  <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-black tracking-wide uppercase bg-black text-white shadow-xs">
                    President
                  </span>
                </div>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-6">
            {/* Breadcrumb */}
            <nav className="flex items-center gap-2 text-xs font-semibold text-slate-500">
              <a href="dashboard.html" className="hover:text-black transition-colors">Dashboard</a>
              <span>/</span>
              <span className="text-black font-bold">Deadlines</span>
            </nav>

            {/* PAGE HEADER PATTERN: [Bold page title] [light-gray count/status pill] + subtitle */}
            <div className="clean-card p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-3">
                  <h1 className="text-2xl sm:text-3xl font-black text-[#0F1729] tracking-tight">
                    Deadlines
                  </h1>
                  <span className="text-xs font-bold px-3 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200">
                    5 due this week
                  </span>
                </div>
                <p className="text-xs sm:text-sm text-slate-500 mt-1">
                  Every deadline across tasks, documents, and meetings synchronized in one timeline.
                </p>
              </div>

              {/* Admin Action: Nudge Everyone */}
              {isAdmin && (
                <button
                  onClick={() => setNudgeModal(true)}
                  className="btn-black flex items-center gap-2 px-4 py-2 text-xs font-bold rounded-xl shadow-xs"
                >
                  <span>⚡ Nudge Everyone Due This Week</span>
                </button>
              )}
            </div>

            {/* VIEW TOGGLE & LEGEND BAR */}
            <div className="clean-card p-4 flex flex-wrap items-center justify-between gap-3">
              {/* Type Legend */}
              <div className="flex items-center gap-4 text-xs">
                <span className="flex items-center gap-1.5 font-semibold text-slate-700">
                  <span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span> Tasks
                </span>
                <span className="flex items-center gap-1.5 font-semibold text-slate-700">
                  <span className="w-2.5 h-2.5 rounded-full bg-purple-600"></span> Documents
                </span>
                <span className="flex items-center gap-1.5 font-semibold text-slate-700">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-600"></span> Meeting Follow-ups
                </span>
              </div>

              {/* View Toggle */}
              <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs">
                <button
                  onClick={() => setView('week')}
                  className={`px-3 py-1 rounded-lg font-bold transition-all ${
                    view === 'week' ? 'bg-black text-white shadow-xs' : 'text-slate-600 hover:text-black'
                  }`}
                >
                  This Week
                </button>
                <button
                  onClick={() => setView('calendar')}
                  className={`px-3 py-1 rounded-lg font-bold transition-all ${
                    view === 'calendar' ? 'bg-black text-white shadow-xs' : 'text-slate-600 hover:text-black'
                  }`}
                >
                  Calendar Month
                </button>
                <button
                  onClick={() => setView('list')}
                  className={`px-3 py-1 rounded-lg font-bold transition-all ${
                    view === 'list' ? 'bg-black text-white shadow-xs' : 'text-slate-600 hover:text-black'
                  }`}
                >
                  All Upcoming
                </button>
              </div>
            </div>

            {/* SKELETON */}
            {loading ? (
              <div className="clean-card p-6 space-y-4">
                {[...Array(4)].map((_, i) => (
                  <div key={i} className="h-16 bg-slate-100 rounded-xl animate-pulse"></div>
                ))}
              </div>
            ) : view === 'calendar' ? (
              /* CALENDAR VIEW */
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                <div className="lg:col-span-8 clean-card p-6">
                  <div className="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                    <h3 className="text-base font-bold text-slate-900">September 2026</h3>
                    <span className="text-xs font-bold text-slate-500">Event Date: Oct 15, 2026</span>
                  </div>

                  {/* Day Names */}
                  <div className="grid grid-cols-7 text-center font-bold text-xs text-slate-400 mb-2">
                    <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                  </div>

                  {/* Days Grid */}
                  <div className="grid grid-cols-7 gap-2">
                    {calendarDays.map((d, idx) => {
                      if (!d.day) {
                        return <div key={idx} className="h-20 bg-slate-50/50 rounded-xl border border-transparent"></div>;
                      }
                      const hasItems = d.items.length > 0;
                      const isToday = d.dateStr === '2026-09-19';

                      return (
                        <div
                          key={idx}
                          onClick={() => {
                            if (hasItems) {
                              setSelectedDayDeadlines(d.items);
                              setSelectedDateString(d.dateStr);
                            }
                          }}
                          className={`h-20 p-2 rounded-xl border transition-all flex flex-col justify-between ${
                            hasItems ? 'bg-white hover:border-black cursor-pointer shadow-xs' : 'bg-slate-50/50 border-slate-100 text-slate-400'
                          } ${isToday ? 'ring-2 ring-black font-black' : ''}`}
                        >
                          <div className="flex items-center justify-between">
                            <span className={`text-xs ${isToday ? 'text-black font-extrabold' : 'text-slate-700'}`}>
                              {d.day}
                            </span>
                            {isToday && <span className="text-[8px] bg-black text-white px-1 rounded">Today</span>}
                          </div>

                          {/* Dots */}
                          <div className="flex flex-wrap gap-1">
                            {d.items.map((it, i) => (
                              <span
                                key={i}
                                className="w-2 h-2 rounded-full"
                                style={{ backgroundColor: TYPE_STYLES[it.type]?.color || '#000' }}
                                title={`${it.type}: ${it.title}`}
                              ></span>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Calendar Side Panel */}
                <div className="lg:col-span-4 clean-card p-5 space-y-4">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                    <h4 className="text-sm font-bold text-slate-900">
                      {selectedDateString ? `Deadlines on ${selectedDateString}` : 'Click a date on the calendar'}
                    </h4>
                    {selectedDayDeadlines && (
                      <button onClick={() => setSelectedDayDeadlines(null)} className="text-xs text-slate-400 hover:text-black">
                        Clear
                      </button>
                    )}
                  </div>

                  {selectedDayDeadlines && selectedDayDeadlines.length > 0 ? (
                    <div className="space-y-3">
                      {selectedDayDeadlines.map(item => {
                        const style = TYPE_STYLES[item.type] || TYPE_STYLES.task;
                        return (
                          <div key={item.id} className="p-3.5 rounded-xl border border-slate-200 bg-slate-50/60 space-y-2 text-xs">
                            <div className="flex items-center justify-between">
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${style.bg}`}>
                                {style.icon} {style.label}
                              </span>
                              <span className="text-[11px] text-slate-500 font-medium">Owner: {item.owner}</span>
                            </div>
                            <p className="font-bold text-slate-900 leading-snug">{item.title}</p>

                            {isAdmin && (
                              <div className="pt-2 border-t border-slate-200 flex justify-end">
                                <button
                                  onClick={() => handleOpenReschedule(item)}
                                  className="text-[11px] font-bold text-slate-700 hover:text-black underline"
                                >
                                  Reschedule Date
                                </button>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <p className="text-xs text-slate-500">
                      Select any day with colored dots to inspect due tasks, required documents, or meeting action reconciliations.
                    </p>
                  )}
                </div>
              </div>
            ) : (
              /* LIST VIEW (Grouped by Day/Horizon) */
              <div className="space-y-6">
                {Object.entries(groupedDeadlines).map(([groupName, items]) => {
                  if (items.length === 0) return null;

                  return (
                    <div key={groupName} className="space-y-3">
                      <div className="flex items-center gap-2">
                        <h3 className="text-xs font-black uppercase tracking-wider text-slate-500">{groupName}</h3>
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">
                          {items.length}
                        </span>
                      </div>

                      <div className="clean-card divide-y divide-slate-100 overflow-hidden">
                        {items.map(item => {
                          const style = TYPE_STYLES[item.type] || TYPE_STYLES.task;
                          const daysRem = getDaysRemaining(item.dueAt);

                          return (
                            <div key={item.id} className="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/60 transition-colors">
                              <div className="flex items-start sm:items-center gap-3">
                                <span className={`text-xs px-2.5 py-1 rounded-lg border font-bold flex-shrink-0 ${style.bg}`}>
                                  {style.icon} {style.label}
                                </span>
                                <div>
                                  <p className="text-xs font-bold text-slate-900 leading-snug">{item.title}</p>
                                  <p className="text-[11px] text-slate-500 mt-0.5">
                                    Responsible: <strong className="text-slate-700">{item.owner}</strong> • Due {item.dueAt}
                                  </p>
                                </div>
                              </div>

                              <div className="flex items-center gap-3 flex-shrink-0">
                                <div className="text-right">
                                  {daysRem < 0 ? (
                                    <span className="text-[11px] font-black text-red-600 bg-red-50 px-2 py-0.5 rounded border border-red-200">
                                      ⚠️ {Math.abs(daysRem)}d overdue
                                    </span>
                                  ) : daysRem <= 2 ? (
                                    <span className="text-[11px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">
                                      ⏰ {daysRem === 0 ? 'Due today' : `${daysRem}d remaining`}
                                    </span>
                                  ) : (
                                    <span className="text-[11px] font-medium text-slate-500">
                                      {daysRem} days remaining
                                    </span>
                                  )}
                                </div>

                                {isAdmin && (
                                  <button
                                    onClick={() => handleOpenReschedule(item)}
                                    className="px-3 py-1 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors border border-slate-200"
                                  >
                                    Reschedule
                                  </button>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* ADMIN MODAL 1: Nudge Everyone Batch Reminder */}
          {nudgeModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">⚡</span>
                  <h3 className="text-lg font-bold text-slate-900">Batch Deadline Nudge</h3>
                </div>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Send an automated reminder push across Email & WhatsApp to all <strong className="text-black">5 assignees</strong> with deadlines due within the next 7 days.
                </p>

                <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs space-y-1 text-slate-700">
                  <p className="font-bold text-slate-900">Preview Notification Payload:</p>
                  <p className="italic">"Hi [Name], Planova reminder: your milestone for TechNova 2026 is due this week. Please update status on the dashboard."</p>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setNudgeModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                    Cancel
                  </button>
                  <button onClick={handleNudgeEveryone} className="btn-black px-4 py-2 text-xs font-bold rounded-xl flex items-center gap-1.5">
                    <span>Dispatch Reminders</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ADMIN MODAL 2: Reschedule Deadline */}
          {rescheduleModal && itemToReschedule && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-md w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-lg font-bold text-slate-900">Reschedule Milestone Deadline</h3>
                <p className="text-xs text-slate-500">
                  Updating due date for <strong className="text-black">"{itemToReschedule.title}"</strong>.
                </p>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">New Target Date:</label>
                  <input
                    type="date"
                    value={newDueDate}
                    onChange={e => handleDateChange(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-black"
                  />
                </div>

                {/* Event Date Warning */}
                {showEventDateWarning && (
                  <div className="p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-800 space-y-1">
                    <p className="font-bold flex items-center gap-1.5">
                      <span>⚠️ Warning: Beyond Event Date!</span>
                    </p>
                    <p className="text-[11px]">
                      The selected date ({newDueDate}) is after TechNova's event execution date ({EVENT_DATE}). This will impact live day-of operations.
                    </p>
                  </div>
                )}

                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setRescheduleModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                    Cancel
                  </button>
                  <button onClick={handleConfirmReschedule} className="btn-black px-4 py-2 text-xs font-bold rounded-xl">
                    Save New Deadline
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Navigation Sidebar Drawer */}
          {sidebarOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity" onClick={() => setSidebarOpen(false)}></div>
              <div className="fixed inset-y-0 left-0 max-w-full flex pr-10">
                <div className="w-screen max-w-xs sm:max-w-sm bg-white shadow-2xl border-r border-[#E2E8F0] flex flex-col justify-between">
                  <div>
                    <div className="p-5 border-b border-[#E2E8F0] flex items-center justify-between bg-[#F8FAFC]">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-white border border-[#E2E8F0] shadow-xs flex items-center justify-center p-1">
                          <img src="planova-logo.jpg" alt="Logo" className="w-full h-full object-contain" onError={e => { e.target.style.display='none'; e.target.parentElement.innerHTML='<span class="font-black text-black">P</span>'; }} />
                        </div>
                        <div>
                          <h3 className="text-base font-black text-black leading-tight">PLANOVA</h3>
                          <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Navigation Menu</p>
                        </div>
                      </div>
                      <button onClick={() => setSidebarOpen(false)} className="p-1.5 rounded-lg text-slate-400 hover:text-black hover:bg-slate-200 transition-colors">
                        ✕
                      </button>
                    </div>

                    <nav className="p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-160px)]">
                      <div className="px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                        Main Overview
                      </div>
                      {NAV_ITEMS.slice(0, 1).map(item => (
                        <a key={item.name} href={item.path} className="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:text-black hover:bg-slate-100 transition-all">
                          <span className="flex items-center gap-2.5">
                            <span className="text-sm">{item.icon}</span>
                            <span>{item.name}</span>
                          </span>
                          <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-bold border border-slate-200">
                            {item.badge}
                          </span>
                        </a>
                      ))}

                      <div className="pt-4 px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                        Admin Core Modules
                      </div>
                      {NAV_ITEMS.slice(1).map(item => (
                        <a
                          key={item.name}
                          href={item.path}
                          className={`flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                            item.active ? 'bg-black text-white shadow-xs' : 'text-slate-700 hover:text-black hover:bg-slate-100'
                          }`}
                        >
                          <span className="flex items-center gap-2.5">
                            <span className="text-sm">{item.icon}</span>
                            <span>{item.name}</span>
                          </span>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-extrabold ${
                            item.active ? 'bg-slate-800 text-slate-200' : 'bg-slate-100 text-slate-600 border border-slate-200'
                          }`}>
                            {item.badge}
                          </span>
                        </a>
                      ))}
                    </nav>
                  </div>

                  <div className="p-4 border-t border-[#E2E8F0] bg-[#F8FAFC] flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center">
                        J
                      </div>
                      <div>
                        <p className="text-xs font-bold text-black leading-tight">Jenish</p>
                        <p className="text-[10px] font-extrabold text-slate-500 uppercase">{isAdmin ? 'President (Admin)' : 'Member'}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2 animate-bounce border border-slate-700">
              <span className="text-emerald-400">✓</span>
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<DeadlinesApp />, document.getElementById('root'));
  </script>
</body>
</html>
