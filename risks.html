<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risks — Planova Admin</title>
  <meta name="description" content="AI Risk Radar, impact vs likelihood quadrant matrix, and risk mitigation governance for Planova campus clubs.">
  <link rel="icon" type="image/jpeg" href="planova-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: '#4F46E5',
            ai: '#0E7490',
            'status-todo': '#94A3B8',
            'status-doing': '#2563EB',
            'status-blocked': '#DC2626',
            'status-review': '#D97706',
            'status-done': '#059669',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F8FAFC;
      color: #0F1729;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .clean-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      transition: box-shadow 150ms ease, border-color 150ms ease;
    }
    .clean-card:hover {
      border-color: #CBD5E1;
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06);
    }
    .btn-black {
      background-color: #000000;
      color: #FFFFFF;
      transition: background-color 150ms ease;
    }
    .btn-black:hover {
      background-color: #1E293B;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const INITIAL_RISKS = [
      {
        id: 'rsk-1',
        title: 'Auditorium Permission Letter Pending Official Dean Stamp',
        severity: 'critical', // critical | high | medium | low
        likelihood: 'high', // low | high
        impact: 'high', // low | high
        facts: '4 days until dress rehearsal, no confirmed room reservation in university system, 350 attendees expected.',
        aiExplanation: 'Without an approved physical permit, campus security locks venue electrical breaker mains 2 hours prior to start. Potential catastrophic delay.',
        mitigationSteps: [
          { text: 'Obtain expedited sign-off from Head of Student Activities', done: false },
          { text: 'Reserve backup Seminar Hall 3 as secondary fallback', done: true },
          { text: 'File safety officer EMT waiver with campus health', done: false }
        ],
        owner: 'Priya Patel',
        isEscalated: true,
        status: 'open'
      },
      {
        id: 'rsk-2',
        title: 'Stage Wi-Fi Router IP Pool Insufficient for Hackathon Density',
        severity: 'high',
        likelihood: 'high',
        impact: 'medium',
        facts: '350 hackers registered with multiple devices, existing subnet DHCP lease capped at 150 concurrent IPs.',
        aiExplanation: 'Hackers will experience IP collision and dropped websocket tunnels during live demos unless VLAN DHCP is expanded to /22 subnet.',
        mitigationSteps: [
          { text: 'Request IT Services allocate dedicated 10.42.0.0/22 VLAN', done: true },
          { text: 'Deploy 4 secondary dual-band access points across south tables', done: false }
        ],
        owner: 'Arjun Rao',
        isEscalated: false,
        status: 'open'
      },
      {
        id: 'rsk-3',
        title: 'Title Sponsor Deliverables Agreement Lacks Banner Sign-off',
        severity: 'medium',
        likelihood: 'low',
        impact: 'high',
        facts: 'Title sponsor contract signed for $5,000, but vinyl backdrop physical specs not acknowledged in writing.',
        aiExplanation: 'Risk of sponsor dissatisfaction or post-event invoice deduction if podium placement size does not meet brand guidelines.',
        mitigationSteps: [
          { text: 'Send formal proof mockup with dimensional rulers to sponsor PR', done: false },
          { text: 'Receive counter-signed proof sheet', done: false }
        ],
        owner: 'Dev Malik',
        isEscalated: false,
        status: 'open'
      },
      {
        id: 'rsk-4',
        title: 'Volunteer T-Shirt Batch Delivery Delayed 24 Hours',
        severity: 'low',
        likelihood: 'low',
        impact: 'low',
        facts: 'Vendor textile shipment pushed from Sep 24 to Sep 25 due to regional courier transit backlog.',
        aiExplanation: 'Minimal operational impact. Volunteers can wear branded badges at kickoff if shirt distribution shifts to morning check-in.',
        mitigationSteps: [
          { text: 'Confirm vendor local courier tracking number', done: true }
        ],
        owner: 'Rohan Jha',
        isEscalated: false,
        status: 'open'
      }
    ];

    const NAV_ITEMS = [
      { name: 'Dashboard', path: 'dashboard.html', icon: '📊', badge: 'Home' },
      { name: 'Tasks', path: 'tasks.html', icon: '📋', badge: '68 Total' },
      { name: 'Volunteers', path: 'volunteers.html', icon: '👥', badge: '22 Members' },
      { name: 'Meetings', path: 'meetings.html', icon: '🎙️', badge: '9 Meetings' },
      { name: 'Deadlines', path: 'deadlines.html', icon: '⏰', badge: '5 This Week' },
      { name: 'Document Review', path: 'documents-review.html', icon: '📄', badge: '2 Pending' },
      { name: 'Risks', path: 'risks.html', icon: '⚠️', active: true, badge: '1 Critical' },
      { name: 'Announcements', path: 'announcements.html', icon: '📢', badge: '12 Sent' },
      { name: 'Knowledge Base', path: 'knowledge.html', icon: '🧠', badge: '24 Docs' }
    ];

    const SEVERITY_CONFIG = {
      critical: { label: 'Critical', color: '#B91C1C', bg: 'bg-red-50 text-red-800 border-red-200', borderLeft: 'border-l-[#B91C1C]' },
      high: { label: 'High', color: '#EA580C', bg: 'bg-orange-50 text-orange-800 border-orange-200', borderLeft: 'border-l-[#EA580C]' },
      medium: { label: 'Medium', color: '#D97706', bg: 'bg-amber-50 text-amber-800 border-amber-200', borderLeft: 'border-l-[#D97706]' },
      low: { label: 'Low', color: '#64748B', bg: 'bg-slate-100 text-slate-700 border-slate-200', borderLeft: 'border-l-[#64748B]' }
    };

    const MEMBERS = ['Priya Patel', 'Arjun Rao', 'Neha Sharma', 'Dev Malik', 'Rohan Jha', 'Tanvi Gaikwad', 'Kavya Sen'];

    function RisksApp() {
      const isAdmin = true;
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [loading, setLoading] = useState(true);

      const [risks, setRisks] = useState(INITIAL_RISKS);

      // Modals
      const [manualRiskModal, setManualRiskModal] = useState(false);
      const [closeModal, setCloseModal] = useState(false);
      const [riskToClose, setRiskToClose] = useState(null);
      const [closeReason, setCloseReason] = useState('');
      const [assignModal, setAssignModal] = useState(false);
      const [riskToAssign, setRiskToAssign] = useState(null);
      const [newOwner, setNewOwner] = useState(MEMBERS[0]);

      // Manual Risk Form
      const [newTitle, setNewTitle] = useState('');
      const [newSeverity, setNewSeverity] = useState('high');
      const [newDescription, setNewDescription] = useState('');
      const [newMitigation, setNewMitigation] = useState('');

      // Toast
      const [toast, setToast] = useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        const timer = setTimeout(() => setLoading(false), 400);
        return () => clearTimeout(timer);
      }, []);

      const openRisks = useMemo(() => risks.filter(r => r.status === 'open'), [risks]);
      const criticalCount = useMemo(() => openRisks.filter(r => r.severity === 'critical').length, [openRisks]);

      // Sort critical -> low
      const sortedRisks = useMemo(() => {
        const order = { critical: 1, high: 2, medium: 3, low: 4 };
        return [...openRisks].sort((a, b) => order[a.severity] - order[b.severity]);
      }, [openRisks]);

      const handleToggleMitigation = (riskId, stepIndex) => {
        setRisks(prev => prev.map(r => {
          if (r.id === riskId) {
            const steps = [...r.mitigationSteps];
            steps[stepIndex] = { ...steps[stepIndex], done: !steps[stepIndex].done };
            return { ...r, mitigationSteps: steps };
          }
          return r;
        }));
      };

      const handleEscalateRisk = (riskId) => {
        setRisks(prev => prev.map(r => {
          if (r.id === riskId) {
            const next = !r.isEscalated;
            showToast(next ? '📌 Risk escalated & pinned to Dashboard greeting!' : 'Unpinned from Dashboard.');
            return { ...r, isEscalated: next };
          }
          return r;
        }));
      };

      const handleConfirmClose = () => {
        if (!riskToClose || !closeReason.trim()) return;
        setRisks(prev => prev.map(r => {
          if (r.id === riskToClose.id) {
            return { ...r, status: 'closed', closedReason: closeReason.trim() };
          }
          return r;
        }));
        showToast(`Risk "${riskToClose.title}" manually closed.`);
        setCloseModal(false);
        setRiskToClose(null);
        setCloseReason('');
      };

      const handleConfirmAssign = () => {
        if (!riskToAssign) return;
        setRisks(prev => prev.map(r => r.id === riskToAssign.id ? { ...r, owner: newOwner } : r));
        showToast(`Assigned risk to ${newOwner}.`);
        setAssignModal(false);
        setRiskToAssign(null);
      };

      const handleCreateManualRisk = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const created = {
          id: `rsk-${Date.now()}`,
          title: newTitle.trim(),
          severity: newSeverity,
          likelihood: 'high',
          impact: newSeverity === 'critical' ? 'high' : 'medium',
          facts: newDescription.trim() || 'Identified via presidential observation.',
          aiExplanation: 'Institutional risk flagged manually by executive administration.',
          mitigationSteps: newMitigation ? [{ text: newMitigation.trim(), done: false }] : [{ text: 'Review contingency plan', done: false }],
          owner: 'Unassigned',
          isEscalated: false,
          status: 'open'
        };
        setRisks(prev => [created, ...prev]);
        showToast('Manual risk logged and added to radar.');
        setManualRiskModal(false);
        setNewTitle('');
        setNewDescription('');
        setNewMitigation('');
      };

      return (
        <div className="min-h-screen bg-[#F8FAFC]">
          {/* Top Bar */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-[#E2E8F0] px-4 sm:px-8 py-3 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-3 sm:gap-4">
              <button
                onClick={() => setSidebarOpen(true)}
                className="p-2 -ml-1 text-slate-700 hover:text-black hover:bg-slate-100 rounded-xl transition-colors flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-black"
                title="Open Navigation Menu"
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <span className="hidden md:inline text-xs font-bold text-slate-800">Modules</span>
              </button>

              <a href="dashboard.html" className="flex items-center gap-3 group">
                <div className="w-10 h-10 rounded-xl bg-white border border-[#E2E8F0] shadow-xs flex items-center justify-center p-1 flex-shrink-0">
                  <img src="planova-logo.jpg" alt="Logo" className="w-full h-full object-contain" onError={e => { e.target.style.display='none'; e.target.parentElement.innerHTML='<span class="font-black text-black">P</span>'; }} />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xl font-black tracking-tight text-black leading-none">PLANOVA</span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-black border border-slate-300">
                      TechNova 2026
                    </span>
                  </div>
                  <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block mt-0.5">
                    Risk Radar & Mitigation
                  </span>
                </div>
              </a>
            </div>

            <div className="flex items-center gap-3">
              <a
                href="dashboard.html"
                className="hidden sm:inline-flex items-center gap-1.5 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl transition-colors border border-slate-200"
              >
                ← Dashboard
              </a>

              {/* Profile with President Role */}
              <div className="flex items-center gap-2.5 pl-3 border-l border-slate-200">
                <div className="relative flex-shrink-0">
                  <div className="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center shadow-xs">
                    J
                  </div>
                  <span className="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white" title="Online"></span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-extrabold text-black leading-tight">Jenish</span>
                  <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-black tracking-wide uppercase bg-black text-white shadow-xs">
                    President
                  </span>
                </div>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-6">
            {/* Breadcrumb */}
            <nav className="flex items-center gap-2 text-xs font-semibold text-slate-500">
              <a href="dashboard.html" className="hover:text-black transition-colors">Dashboard</a>
              <span>/</span>
              <span className="text-black font-bold">Risks</span>
            </nav>

            {/* PAGE HEADER PATTERN: [Bold page title] [light-gray count/status pill] + subtitle */}
            <div className="clean-card p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-3">
                  <h1 className="text-2xl sm:text-3xl font-black text-[#0F1729] tracking-tight">
                    Risks
                  </h1>
                  <span className="text-xs font-bold px-3 py-1 rounded-full bg-red-50 text-red-800 border border-red-200">
                    {openRisks.length} open ({criticalCount} critical)
                  </span>
                </div>
                <p className="text-xs sm:text-sm text-slate-500 mt-1">
                  Detected automatically, explained by AI, and governed by administrative intervention.
                </p>
              </div>

              {/* Admin Actions */}
              {isAdmin && (
                <button
                  onClick={() => setManualRiskModal(true)}
                  className="btn-black flex items-center gap-1.5 px-4 py-2 text-xs font-bold rounded-xl shadow-xs"
                >
                  <span>+ Raise Manual Risk</span>
                </button>
              )}
            </div>

            {/* 2X2 MATRIX: Impact vs Likelihood */}
            <div className="clean-card p-6 space-y-4">
              <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                <div>
                  <h3 className="text-sm font-bold text-slate-900">Risk Radar Quadrant Matrix</h3>
                  <p className="text-xs text-slate-500">Visual mapping of operational impact against probability of occurrence</p>
                </div>
                <div className="flex items-center gap-4 text-xs">
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#B91C1C]"></span> Critical</span>
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#EA580C]"></span> High</span>
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#D97706]"></span> Medium</span>
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-[#64748B]"></span> Low</span>
                </div>
              </div>

              {/* Quadrant Grid */}
              <div className="grid grid-cols-2 gap-3 min-h-[220px]">
                {/* Top-Left: High Impact, Low Likelihood */}
                <div className="p-4 rounded-xl bg-amber-50/40 border border-amber-200 flex flex-col justify-between">
                  <span className="text-[10px] font-extrabold uppercase text-amber-800">High Impact / Low Likelihood</span>
                  <div className="space-y-1.5 my-2">
                    {sortedRisks.filter(r => r.impact === 'high' && r.likelihood === 'low').map(r => (
                      <div key={r.id} className="flex items-center gap-2 text-xs font-bold text-slate-900 bg-white/90 p-2 rounded-lg border border-amber-200">
                        <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: SEVERITY_CONFIG[r.severity]?.color }}></span>
                        <span className="truncate">{r.title}</span>
                      </div>
                    ))}
                  </div>
                  <span className="text-[9px] text-slate-400">Contingency Planning</span>
                </div>

                {/* Top-Right: High Impact, High Likelihood (RED ZONE) */}
                <div className="p-4 rounded-xl bg-red-50/50 border border-red-300 flex flex-col justify-between">
                  <span className="text-[10px] font-extrabold uppercase text-red-800">High Impact / High Likelihood (Immediate Action)</span>
                  <div className="space-y-1.5 my-2">
                    {sortedRisks.filter(r => r.impact === 'high' && r.likelihood === 'high').map(r => (
                      <div key={r.id} className="flex items-center gap-2 text-xs font-bold text-slate-900 bg-white p-2 rounded-lg border border-red-300 shadow-xs">
                        <span className="w-2.5 h-2.5 rounded-full flex-shrink-0 animate-ping" style={{ backgroundColor: SEVERITY_CONFIG[r.severity]?.color }}></span>
                        <span className="truncate font-black">{r.title}</span>
                      </div>
                    ))}
                  </div>
                  <span className="text-[9px] text-red-600 font-bold">Priority Escalation Zone</span>
                </div>

                {/* Bottom-Left: Low Impact, Low Likelihood */}
                <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col justify-between">
                  <span className="text-[10px] font-extrabold uppercase text-slate-600">Low Impact / Low Likelihood</span>
                  <div className="space-y-1.5 my-2">
                    {sortedRisks.filter(r => r.impact === 'low' && r.likelihood === 'low').map(r => (
                      <div key={r.id} className="flex items-center gap-2 text-xs font-medium text-slate-800 bg-white p-2 rounded-lg border border-slate-200">
                        <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: SEVERITY_CONFIG[r.severity]?.color }}></span>
                        <span className="truncate">{r.title}</span>
                      </div>
                    ))}
                  </div>
                  <span className="text-[9px] text-slate-400">Monitor Passively</span>
                </div>

                {/* Bottom-Right: Low Impact, High Likelihood */}
                <div className="p-4 rounded-xl bg-blue-50/40 border border-blue-200 flex flex-col justify-between">
                  <span className="text-[10px] font-extrabold uppercase text-blue-800">Low Impact / High Likelihood</span>
                  <div className="space-y-1.5 my-2">
                    {sortedRisks.filter(r => r.impact === 'medium' || (r.impact === 'low' && r.likelihood === 'high')).map(r => (
                      <div key={r.id} className="flex items-center gap-2 text-xs font-semibold text-slate-900 bg-white p-2 rounded-lg border border-blue-200">
                        <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: SEVERITY_CONFIG[r.severity]?.color }}></span>
                        <span className="truncate">{r.title}</span>
                      </div>
                    ))}
                  </div>
                  <span className="text-[9px] text-slate-400">Standard Mitigation</span>
                </div>
              </div>
            </div>

            {/* SKELETON */}
            {loading ? (
              <div className="space-y-4">
                {[...Array(3)].map((_, i) => (
                  <div key={i} className="clean-card p-6 h-40 animate-pulse bg-white space-y-3">
                    <div className="h-4 bg-slate-200 rounded w-1/4"></div>
                    <div className="h-4 bg-slate-100 rounded w-3/4"></div>
                  </div>
                ))}
              </div>
            ) : sortedRisks.length === 0 ? (
              /* EMPTY STATE */
              <div className="clean-card p-12 text-center max-w-lg mx-auto my-8">
                <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                  ✓
                </div>
                <h3 className="text-base font-bold text-slate-900">Zero Open Operational Risks</h3>
                <p className="text-xs text-slate-500 mt-1 max-w-sm mx-auto">
                  All identified failure points have been resolved or signed off with presidential justification notes.
                </p>
              </div>
            ) : (
              /* RISK CARDS (Sorted Critical -> Low) */
              <div className="space-y-4">
                {sortedRisks.map(risk => {
                  const sev = SEVERITY_CONFIG[risk.severity] || SEVERITY_CONFIG.medium;

                  return (
                    <div
                      key={risk.id}
                      className={`clean-card p-6 border-l-4 ${sev.borderLeft} space-y-4`}
                    >
                      {/* Top Row: Title + Severity Badge + Owner + Escalation Pill */}
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div className="flex items-center gap-3">
                          <span className={`text-[10px] font-black uppercase px-2.5 py-1 rounded-full border ${sev.bg}`}>
                            {sev.label} Severity
                          </span>
                          <h3 className="text-base font-bold text-slate-900 leading-tight">
                            {risk.title}
                          </h3>
                        </div>

                        <div className="flex items-center gap-2 text-xs">
                          {risk.isEscalated && (
                            <span className="inline-flex items-center gap-1 text-[10px] font-black px-2 py-0.5 rounded bg-red-100 text-red-800 border border-red-200">
                              📌 Escalated to Dashboard
                            </span>
                          )}
                          <span className="text-slate-500 font-medium">Owner: <strong className="text-slate-800">{risk.owner}</strong></span>
                        </div>
                      </div>

                      {/* Detected Facts */}
                      <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-800 font-medium flex items-start gap-2">
                        <span className="text-slate-400 font-bold">Facts:</span>
                        <span>{risk.facts}</span>
                      </div>

                      {/* AI-Written Explanation (Strictly Cyan #0E7490) */}
                      <div className="p-3.5 rounded-xl bg-cyan-50/50 border border-cyan-200 text-xs space-y-1">
                        <div className="flex items-center gap-1.5 text-[#0E7490] font-black text-[11px]">
                          <span>✦ PLANOVA AI IMPACT PROJECTION</span>
                        </div>
                        <p className="text-slate-800 leading-relaxed">{risk.aiExplanation}</p>
                      </div>

                      {/* Mitigation Steps Checklist */}
                      <div className="space-y-2">
                        <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider">
                          Mitigation Checklist ({risk.mitigationSteps.filter(s => s.done).length}/{risk.mitigationSteps.length} complete)
                        </h4>
                        <div className="space-y-1.5">
                          {risk.mitigationSteps.map((step, idx) => (
                            <label
                              key={idx}
                              className={`flex items-center gap-2.5 p-2 rounded-lg border text-xs cursor-pointer transition-colors ${
                                step.done ? 'bg-emerald-50/50 border-emerald-200 text-emerald-900 line-through opacity-80' : 'bg-white border-slate-200 text-slate-800'
                              }`}
                            >
                              <input
                                type="checkbox"
                                checked={step.done}
                                onChange={() => handleToggleMitigation(risk.id, idx)}
                                className="rounded border-slate-300 text-emerald-600 focus:ring-emerald-600 w-4 h-4 cursor-pointer"
                              />
                              <span className="font-medium">{step.text}</span>
                            </label>
                          ))}
                        </div>
                      </div>

                      {/* ADMIN-ONLY ACTIONS: Assign Owner | Create Task | Escalate | Close */}
                      {isAdmin && (
                        <div className="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
                          <div className="flex items-center gap-2">
                            <button
                              onClick={() => {
                                setRiskToAssign(risk);
                                setNewOwner(risk.owner !== 'Unassigned' ? risk.owner : MEMBERS[0]);
                                setAssignModal(true);
                              }}
                              className="px-3 py-1.5 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors border border-slate-200"
                            >
                              Assign Owner
                            </button>

                            <a
                              href="tasks.html"
                              className="px-3 py-1.5 text-xs font-bold text-slate-700 hover:text-black bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors border border-slate-200"
                            >
                              + Convert to Task
                            </a>

                            <button
                              onClick={() => handleEscalateRisk(risk.id)}
                              className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-colors border ${
                                risk.isEscalated
                                  ? 'bg-red-50 text-red-700 border-red-200'
                                  : 'bg-slate-100 text-slate-700 hover:text-black border-slate-200'
                              }`}
                            >
                              {risk.isEscalated ? 'Un-escalate' : 'Escalate to Greeting'}
                            </button>
                          </div>

                          <button
                            onClick={() => {
                              setRiskToClose(risk);
                              setCloseReason('');
                              setCloseModal(true);
                            }}
                            className="btn-black px-3.5 py-1.5 text-xs font-bold rounded-lg"
                          >
                            Resolve / Close Risk
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* ADMIN MODAL 1: Manually Close Risk with Reason */}
          {closeModal && riskToClose && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center gap-2">
                  <span className="text-xl">🛡️</span>
                  <h3 className="text-lg font-bold text-slate-900">Close Operational Risk</h3>
                </div>
                <p className="text-xs text-slate-500">
                  Manually resolving <strong className="text-black">"{riskToClose.title}"</strong>. An administrative justification note is required even if automated condition remains active.
                </p>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Required Resolution Justification:
                  </label>
                  <textarea
                    rows="3"
                    value={closeReason}
                    onChange={e => setCloseReason(e.target.value)}
                    placeholder="e.g. Dean verbally guaranteed access code 8421; Dean's assistant attending in person..."
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium focus:ring-2 focus:ring-black text-slate-900"
                  ></textarea>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setCloseModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                    Cancel
                  </button>
                  <button
                    onClick={handleConfirmClose}
                    disabled={!closeReason.trim()}
                    className="btn-black px-4 py-2 text-xs font-bold rounded-xl disabled:opacity-50"
                  >
                    Confirm Resolution
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ADMIN MODAL 2: Raise Manual Risk */}
          {manualRiskModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-lg font-bold text-slate-900">+ Raise Manual Risk</h3>
                <p className="text-xs text-slate-500">
                  Log an unforeseen vulnerability or institutional challenge not caught by automated rules.
                </p>

                <form onSubmit={handleCreateManualRisk} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Risk Title:</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Rainy weather forecast may flood outdoor registration canopy"
                      value={newTitle}
                      onChange={e => setNewTitle(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-black text-slate-900"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Severity Level:</label>
                    <select
                      value={newSeverity}
                      onChange={e => setNewSeverity(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-black text-slate-900"
                    >
                      <option value="critical">Critical (Immediate event failure potential)</option>
                      <option value="high">High (Severe delay or budget hazard)</option>
                      <option value="medium">Medium (Moderate operational inconvenience)</option>
                      <option value="low">Low (Minor cosmetic / comfort concern)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Observed Facts / Context:</label>
                    <textarea
                      rows="2"
                      placeholder="Describe the underlying condition..."
                      value={newDescription}
                      onChange={e => setNewDescription(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium focus:ring-2 focus:ring-black text-slate-900"
                    ></textarea>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Initial Mitigation Step:</label>
                    <input
                      type="text"
                      placeholder="e.g. Move check-in tables into building interior atrium"
                      value={newMitigation}
                      onChange={e => setNewMitigation(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-medium focus:ring-2 focus:ring-black text-slate-900"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setManualRiskModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                      Cancel
                    </button>
                    <button type="submit" className="btn-black px-4 py-2 text-xs font-bold rounded-xl">
                      Save & Pin to Radar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADMIN MODAL 3: Assign Owner */}
          {assignModal && riskToAssign && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="clean-card max-w-md w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-lg font-bold text-slate-900">Assign Risk Owner</h3>
                <p className="text-xs text-slate-500">Designate an executive lead responsible for mitigating this risk.</p>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Select Assignee:</label>
                  <select
                    value={newOwner}
                    onChange={e => setNewOwner(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold focus:ring-2 focus:ring-black"
                  >
                    {MEMBERS.map(m => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setAssignModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:text-black">
                    Cancel
                  </button>
                  <button onClick={handleConfirmAssign} className="btn-black px-4 py-2 text-xs font-bold rounded-xl">
                    Save Assignee
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Navigation Sidebar Drawer */}
          {sidebarOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity" onClick={() => setSidebarOpen(false)}></div>
              <div className="fixed inset-y-0 left-0 max-w-full flex pr-10">
                <div className="w-screen max-w-xs sm:max-w-sm bg-white shadow-2xl border-r border-[#E2E8F0] flex flex-col justify-between">
                  <div>
                    <div className="p-5 border-b border-[#E2E8F0] flex items-center justify-between bg-[#F8FAFC]">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-white border border-[#E2E8F0] shadow-xs flex items-center justify-center p-1">
                          <img src="planova-logo.jpg" alt="Logo" className="w-full h-full object-contain" onError={e => { e.target.style.display='none'; e.target.parentElement.innerHTML='<span class="font-black text-black">P</span>'; }} />
                        </div>
                        <div>
                          <h3 className="text-base font-black text-black leading-tight">PLANOVA</h3>
                          <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Navigation Menu</p>
                        </div>
                      </div>
                      <button onClick={() => setSidebarOpen(false)} className="p-1.5 rounded-lg text-slate-400 hover:text-black hover:bg-slate-200 transition-colors">
                        ✕
                      </button>
                    </div>

                    <nav className="p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-160px)]">
                      <div className="px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                        Main Overview
                      </div>
                      {NAV_ITEMS.slice(0, 1).map(item => (
                        <a key={item.name} href={item.path} className="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:text-black hover:bg-slate-100 transition-all">
                          <span className="flex items-center gap-2.5">
                            <span className="text-sm">{item.icon}</span>
                            <span>{item.name}</span>
                          </span>
                          <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-bold border border-slate-200">
                            {item.badge}
                          </span>
                        </a>
                      ))}

                      <div className="pt-4 px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                        Admin Core Modules
                      </div>
                      {NAV_ITEMS.slice(1).map(item => (
                        <a
                          key={item.name}
                          href={item.path}
                          className={`flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                            item.active ? 'bg-black text-white shadow-xs' : 'text-slate-700 hover:text-black hover:bg-slate-100'
                          }`}
                        >
                          <span className="flex items-center gap-2.5">
                            <span className="text-sm">{item.icon}</span>
                            <span>{item.name}</span>
                          </span>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-extrabold ${
                            item.active ? 'bg-slate-800 text-slate-200' : 'bg-slate-100 text-slate-600 border border-slate-200'
                          }`}>
                            {item.badge}
                          </span>
                        </a>
                      ))}
                    </nav>
                  </div>

                  <div className="p-4 border-t border-[#E2E8F0] bg-[#F8FAFC] flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center">
                        J
                      </div>
                      <div>
                        <p className="text-xs font-bold text-black leading-tight">Jenish</p>
                        <p className="text-[10px] font-extrabold text-slate-500 uppercase">{isAdmin ? 'President (Admin)' : 'Member'}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2 animate-bounce border border-slate-700">
              <span className="text-emerald-400">✓</span>
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<RisksApp />, document.getElementById('root'));
  </script>
</body>
</html>
