    /* ══════════════════════════════════════════════════════════
       COLORFUL RICH TEXT PARSER
       ══════════════════════════════════════════════════════════ */
    function renderColorfulText(text) {
      if (!text) return null;
      // Splits by **bold** or "quoted" phrases
      const parts = text.split(/(\*\*.*?\*\*|".*?")/g);
      return parts.map((part, idx) => {
        if (!part) return null;
        if (part.startsWith('**') && part.endsWith('**')) {
          const content = part.slice(2, -2);
          const lower = content.toLowerCase();
          // Color code based on entity type:
          if (lower.includes('sep') || lower.includes('tomorrow') || lower.includes('today') || lower.includes('am') || lower.includes('pm') || lower.includes('shift') || lower.includes('hours') || lower.includes('window')) {
            return (
              <span key={idx} className="inline-flex items-center px-1.5 py-0.5 my-0.5 rounded-md text-[11px] font-black bg-emerald-100/90 text-emerald-950 border border-emerald-300 shadow-xs">
                {content}
              </span>
            );
          }
          if (lower.includes('entrance') || lower.includes('desk') || lower.includes('hall') || lower.includes('auditorium') || lower.includes('gate') || lower.includes('station') || lower.includes('location')) {
            return (
              <span key={idx} className="inline-flex items-center px-1.5 py-0.5 my-0.5 rounded-md text-[11px] font-black bg-cyan-100/90 text-cyan-950 border border-cyan-300 shadow-xs">
                {content}
              </span>
            );
          }
          if (lower.includes('overdue') || lower.includes('risk') || lower.includes('restricted') || lower.includes('blocked') || lower.includes('critical') || lower.includes('notice')) {
            return (
              <span key={idx} className="inline-flex items-center px-1.5 py-0.5 my-0.5 rounded-md text-[11px] font-black bg-rose-100/90 text-rose-950 border border-rose-300 shadow-xs">
                {content}
              </span>
            );
          }
          if (lower.includes('task') || lower.includes('technova') || lower.includes('priority') || lower.includes('due') || lower.includes('completed')) {
            return (
              <span key={idx} className="inline-flex items-center px-1.5 py-0.5 my-0.5 rounded-md text-[11px] font-black bg-indigo-100/90 text-indigo-950 border border-indigo-300 shadow-xs">
                {content}
              </span>
            );
          }
          return (
            <span key={idx} className="inline-flex items-center px-1.5 py-0.5 my-0.5 rounded-md text-[11px] font-extrabold bg-slate-200/90 text-slate-900 border border-slate-300">
              {content}
            </span>
          );
        } else if (part.startsWith('"') && part.endsWith('"')) {
          const quote = part.slice(1, -1);
          return (
            <span key={idx} className="inline-flex items-center px-1.5 py-0.5 my-0.5 rounded-md text-[11px] font-bold bg-amber-50 text-amber-900 border border-amber-200 italic shadow-xs">
              "{quote}"
            </span>
          );
        }
        return <span key={idx}>{part}</span>;
      });
    }

                  Administrative tools (reassigning members, club budgets, or sending campus broadcasts) are restricted to the <strong className="text-rose-950 underline decoration-rose-300">Executive President</strong>.
                </span>
              </div>
              <div className="bg-white/90 rounded-xl p-2.5 border border-rose-200 text-[11px] text-slate-700 space-y-1">
                <span className="font-extrabold text-emerald-700 uppercase tracking-wider block text-[10px]">Your Volunteer Permissions:</span>
                <p className="font-medium">✓ View and complete personal tasks</p>
                <p className="font-medium">✓ Check shift timings and assigned stations</p>
                <p className="font-medium">✓ Escalate blockers to the Risk Radar</p>
              </div>
            </div>
          )}

          {isActionDone && (
            <div className="rounded-2xl bg-gradient-to-br from-teal-50 to-emerald-50 border-2 border-teal-200 p-3.5 shadow-sm flex items-center gap-3">
              <div className="w-8 h-8 rounded-xl bg-teal-600 text-white flex items-center justify-center font-black text-sm shadow-xs">
                ✓
              </div>
              <div>
                <span className="text-xs font-black text-teal-950 block">Task Marked Done!</span>
                <span className="text-[11px] font-medium text-teal-800">Moved to recently completed archive and progress updated.</span>
              </div>
            </div>
          )}

          {/* BLOCK 3: FORMATTED NARRATIVE SUMMARY (With vibrant styled spans) */}
          <div className="p-3 rounded-2xl bg-slate-50/90 border border-slate-200/90 text-xs text-slate-800 leading-relaxed shadow-xs">
            {renderColorfulText(raw)}
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════
       MAIN COMPONENT: MyTasksApp
       ══════════════════════════════════════════════════════════ */
    function MyTasksApp() {
      const [user] = useState(INITIAL_VOLUNTEER);
      const [announcements, setAnnouncements] = useState(INITIAL_ANNOUNCEMENTS);
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [completedTasks, setCompletedTasks] = useState(INITIAL_COMPLETED_TASKS);
      const [shifts, setShifts] = useState(INITIAL_SHIFTS);

      // Hero Announcement Carousel state
      const [activeSlide, setActiveSlide] = useState(0);
      const [isPaused, setIsPaused] = useState(false);
      const [selectedAnnouncement, setSelectedAnnouncement] = useState(null);
      const [allAnnouncementsModal, setAllAnnouncementsModal] = useState(false);

      // Filter segment for To Do section: 'week' | 'later' | 'all'
      const [todoFilter, setTodoFilter] = useState('week');

      // Task Detail sheet / modal
      const [activeTask, setActiveTask] = useState(null);
      const [blockedText, setBlockedText] = useState('');
      const [showBlockerInput, setShowBlockerInput] = useState(false);
      const [proofPhotoPreview, setProofPhotoPreview] = useState(null);

      // Collapsed Recently Completed toggle
      const [showCompleted, setShowCompleted] = useState(false);

      // Notifications Bell Dropdown Modal
      const [showNotifications, setShowNotifications] = useState(false);

      // Ask Planova Volunteer AI drawer
      const [copilotOpen, setCopilotOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        {
          sender: 'ai',
          text: `Hi ${user.firstName}! I'm your volunteer assistant. Ask me about your upcoming shifts, today's tasks, or what's due next.`
        }
      ]);
      const [chatInput, setChatInput] = useState('');
      const chatBottomRef = useRef(null);

      // Auto-scroll chat when messages update or drawer opens
      useEffect(() => {
        if (copilotOpen && chatBottomRef.current) {
          chatBottomRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages, copilotOpen]);

      // Toast Feedback
      const [toast, setToast] = useState(null);
      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3200);
      };

      // 6-second auto-rotation for Announcement Carousel
      useEffect(() => {
        if (announcements.length <= 1 || isPaused) return;
        const interval = setInterval(() => {
          setActiveSlide(prev => (prev + 1) % announcements.length);
        }, 6000);
        return () => clearInterval(interval);
      }, [announcements.length, isPaused]);

      /* ─── Task Completion Handler (Optimistic UI) ─── */
      const handleToggleComplete = (taskId, e) => {
        if (e) e.stopPropagation();
        const taskToFinish = tasks.find(t => t.id === taskId);
        if (!taskToFinish) return;

        // Animate out and move to completed
        setTasks(prev => prev.filter(t => t.id !== taskId));
        const newCompleted = {
          id: `comp-${Date.now()}`,
          title: taskToFinish.title,
          eventName: taskToFinish.eventName,
          vertical: taskToFinish.vertical,
          completedAt: 'Just now',
          assignedBy: taskToFinish.assignedBy
        };
        setCompletedTasks(prev => [newCompleted, ...prev]);
        showToast(`🎉 Marked "${taskToFinish.title.slice(0, 32)}..." as done!`);

        if (activeTask && activeTask.id === taskId) {
          setActiveTask(null);
        }
      };

      /* ─── Re-open Task from Completed ─── */
      const handleReopenTask = (compItem) => {
        setCompletedTasks(prev => prev.filter(c => c.id !== compItem.id));
        const restoredTask = {
          id: `tsk-${Date.now()}`,
          title: compItem.title,
          description: 'Restored from recently completed.',
          eventName: compItem.eventName,
          vertical: compItem.vertical,
          dueAt: '2026-09-19',
          dueTimeStr: 'Today',
          overdue: false,
          priority: 'P1',
          status: 'todo',
          assignedBy: compItem.assignedBy,
          group: 'today',
          proofPhoto: null,
          blockedReason: null
        };
        setTasks(prev => [restoredTask, ...prev]);
        showToast(`Task reopened and moved to Today.`);
      };

      /* ─── Submit Blocker / Escalate Risk ─── */
      const handleReportBlocker = (e) => {
        e.preventDefault();
        if (!blockedText.trim() || !activeTask) return;

        setTasks(prev => prev.map(t => {
          if (t.id === activeTask.id) {
            return {
              ...t,
              status: 'blocked',
              blockedReason: blockedText.trim()
            };
          }
          return t;
        }));

        showToast(`⚠️ Blocker logged & escalated to Admin Risk Radar!`, 'alert');
        setBlockedText('');
        setShowBlockerInput(false);
        setActiveTask(null);
      };

      /* ─── Mock Photo Proof Upload ─── */
      const handleSimulatePhotoUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            setProofPhotoPreview(ev.target.result);
            showToast('📸 Proof photo attached successfully!');
          };
          reader.readAsDataURL(file);
        } else {
          // Fallback simulation
          setProofPhotoPreview('https://images.unsplash.com/photo-1541872703-74c5e44368f9?w=600&auto=format&fit=crop&q=80');
          showToast('📸 Photo attached: verification_photo.jpg');
        }
      };

      /* ─── Volunteer-Scoped AI Copilot ─── */
      const handleSendChat = (promptText) => {
        const query = promptText || chatInput;
        if (!query.trim()) return;

        setChatMessages(prev => [...prev, { sender: 'user', text: query }]);
        setChatInput('');

        setTimeout(() => {
          const q = query.toLowerCase();
          let reply = '';

          if (q.includes('shift') || q.includes('next shift') || q.includes('when')) {
            const nextShift = shifts[0];
            reply = nextShift 
              ? `Your next shift is **${nextShift.date}** from **${nextShift.timeRange}** at **${nextShift.station}** (${nextShift.role}). It is marked upcoming in 14 hours!`
              : `You do not have any upcoming shifts scheduled right now.`;
          } else if (q.includes('today') || q.includes('tasks') || q.includes('need to do')) {
            const todayCount = tasks.filter(t => t.group === 'today').length;
            const overdueCount = tasks.filter(t => t.overdue).length;
            reply = `You have **${todayCount} tasks due today**${overdueCount > 0 ? ` including **${overdueCount} overdue item** at Gate 2` : ''}. The highest priority is "${tasks[0]?.title || 'none'}".`;
          } else if (q.includes('mark') && q.includes('done')) {
            if (tasks.length > 0) {
              const target = tasks[0];
              handleToggleComplete(target.id);
              reply = `Done! I've marked "${target.title}" as completed and moved it to your completed archive.`;
            } else {
              reply = `All your tasks are already completed! Enjoy your break.`;
            }
          } else if (q.includes('where') || q.includes('location') || q.includes('desk')) {
            reply = `Volunteer check-in and briefing is at **Auditorium Hall B at 5:00 PM**. Meal wristbands can be picked up at **Desk 3 behind the main stage**.`;
          } else if (q.includes('reassign') || q.includes('broadcast') || q.includes('announcement') || q.includes('budget') || q.includes('members')) {
            reply = `🔒 **Volunteer Access Notice:** Administrative tools (reassigning members, viewing club budgets, or sending campus broadcasts) are restricted to the Executive President. As a volunteer, I can help you with your personal schedule, tasks, shifts, and logging blockers!`;
          } else {
            reply = `I checked your schedule: you have ${tasks.length} open tasks across TechNova 2026. Your first priority today is "${tasks[0]?.title || 'All caught up'}". Let me know if you need help with shifts or directions!`;
          }

          setChatMessages(prev => [...prev, { sender: 'ai', text: reply }]);
        }, 400);
      };

      // Split tasks
      const todayTasks = useMemo(() => {
        const list = tasks.filter(t => t.group === 'today');
        // Sort overdue to the very top
        return [...list].sort((a, b) => (b.overdue ? 1 : 0) - (a.overdue ? 1 : 0));
      }, [tasks]);

      const overdueCount = useMemo(() => todayTasks.filter(t => t.overdue).length, [todayTasks]);

      const upcomingTasks = useMemo(() => {
        const otherTasks = tasks.filter(t => t.group !== 'today');
        if (todoFilter === 'week') {
          return otherTasks.filter(t => t.group === 'tomorrow' || t.group === 'this_week');
        }
        if (todoFilter === 'later') {
          return otherTasks.filter(t => t.group === 'later');
        }
        return otherTasks; // 'all'
      }, [tasks, todoFilter]);

      return (
        <div className="min-h-screen bg-[#F8FAFC] text-slate-900 selection:bg-indigo-100 selection:text-indigo-900">
          {/* ══════════════════════════════════════════════════════════
              1. SIMPLE TOP BAR
              ══════════════════════════════════════════════════════════ */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-[#E2E8F0] px-4 sm:px-6 py-3.5 flex items-center justify-between shadow-xs">
            {/* Left: Logo & Event */}
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-white border border-[#E2E8F0] shadow-xs flex items-center justify-center p-1 flex-shrink-0">
                <img
                  src="planova-logo.jpg"
                  alt="Planova Logo"
                  className="w-full h-full object-contain"
                  onError={e => {
                    e.target.style.display = 'none';
                    e.target.parentElement.innerHTML = '<span class="font-black text-black text-sm">P</span>';
                  }}
                />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-lg font-black tracking-tight text-slate-900 leading-none">PLANOVA</span>
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
                    TechNova 2026
                  </span>
                </div>
                <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider block mt-0.5">
                  Volunteer Portal
                </span>
              </div>
            </div>

            {/* Right: Notification Bell & Volunteer Avatar */}
            <div className="flex items-center gap-3">
              {/* Notification Bell */}
              <button
                onClick={() => setShowNotifications(true)}
                className="relative p-2 text-slate-600 hover:text-black hover:bg-slate-100 rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-black"
                title="Club Announcements & Alerts"
                aria-label="Notifications"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
                <span className="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-indigo-600 ring-2 ring-white"></span>
              </button>

              {/* Volunteer Avatar Profile */}
              <div className="flex items-center gap-2 pl-2 border-l border-slate-200">
                <div className="relative">
                  <div className="w-8 h-8 rounded-full bg-slate-900 text-white text-xs font-bold flex items-center justify-center shadow-xs">
                    {user.avatar}
                  </div>
                  <span className="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white" title="Online"></span>
                </div>
                <div className="hidden md:flex flex-col">
                  <span className="text-xs font-extrabold text-slate-900 leading-tight">{user.name}</span>
                  <span className="text-[10px] font-bold text-slate-500">{user.role}</span>
                </div>
              </div>
            </div>
          </header>

          {/* ══════════════════════════════════════════════════════════
              MAIN CONTAINER (Max 720px for warm, focused readability)
              ══════════════════════════════════════════════════════════ */}
          <main className="max-w-2xl mx-auto px-4 sm:px-6 pt-5 pb-16 space-y-6">

            {/* ══════════════════════════════════════════════════════════
                2. HERO ANNOUNCEMENT AREA
                ══════════════════════════════════════════════════════════ */}
            {announcements.length > 0 ? (
              <div
                className="relative overflow-hidden rounded-[20px] bg-gradient-to-br from-[#4338CA] via-[#4F46E5] to-[#6366F1] text-white p-6 sm:p-7 shadow-lg shadow-indigo-500/10 cursor-pointer group"
                onMouseEnter={() => setIsPaused(true)}
                onMouseLeave={() => setIsPaused(false)}
                onTouchStart={() => setIsPaused(true)}
                onTouchEnd={() => setIsPaused(false)}
                onClick={() => setSelectedAnnouncement(announcements[activeSlide])}
              >
                {/* Ambient glow decoration */}
                <div className="absolute -top-10 -right-10 w-44 h-44 rounded-full bg-white/10 blur-2xl pointer-events-none"></div>
                <div className="absolute -bottom-10 -left-10 w-44 h-44 rounded-full bg-indigo-900/30 blur-2xl pointer-events-none"></div>

                <div className="relative z-10 space-y-3">
                  {/* Top Bar inside card */}
                  <div className="flex items-center justify-between">
                    <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/15 backdrop-blur-md text-xs font-bold text-indigo-100 border border-white/20">
                      <span>{announcements[activeSlide].channelIcon}</span>
                      <span>{announcements[activeSlide].channelLabel}</span>
                    </div>
                    <span className="text-[11px] font-medium text-indigo-200">
                      Posted {announcements[activeSlide].postedTime}
                    </span>
                  </div>

                  {/* Announcement Title & Body Preview */}
                  <div>
                    <h2 className="text-lg sm:text-xl font-black leading-snug tracking-tight text-white drop-shadow-xs">
                      {announcements[activeSlide].title}
                    </h2>
                    <p className="text-xs sm:text-sm text-indigo-100/90 line-clamp-2 mt-1.5 leading-relaxed">
                      {announcements[activeSlide].preview}
                    </p>
                  </div>

                  {/* Footer of Card: Dots + "View all announcements" */}
                  <div className="pt-2 flex items-center justify-between border-t border-white/15">
                    {/* Dots indicator */}
                    {announcements.length > 1 ? (
                      <div className="flex items-center gap-1.5" onClick={(e) => e.stopPropagation()}>
                        {announcements.map((_, idx) => (
                          <button
                            key={idx}
                            onClick={() => setActiveSlide(idx)}
                            className={`h-1.5 rounded-full transition-all duration-300 ${
                              idx === activeSlide ? 'w-6 bg-white' : 'w-1.5 bg-white/40 hover:bg-white/70'
                            }`}
                            aria-label={`Slide ${idx + 1}`}
                          />
                        ))}
                      </div>
                    ) : (
                      <div></div>
                    )}

                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        setAllAnnouncementsModal(true);
                      }}
                      className="text-xs font-bold text-white hover:underline flex items-center gap-1"
                    >
                      <span>View all announcements</span>
                      <span>→</span>
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              /* Empty Announcement State */
              <div className="clean-card p-5 text-center flex items-center justify-center gap-2.5 text-xs text-slate-500">
                <span className="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-xs">✓</span>
                <span>No announcements right now — you're all caught up!</span>
              </div>
            )}

            {/* ══════════════════════════════════════════════════════════
                3. GREETING LINE & AI SUMMARY
                ══════════════════════════════════════════════════════════ */}
            <div className="pt-1">
              <h1 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">
                Hi {user.firstName}, here's your day.
              </h1>
              {todayTasks.length > 0 && (
                <p className="text-xs sm:text-sm text-slate-600 mt-1 font-medium flex items-center gap-1.5">
                  <span className="text-indigo-600">✦</span>
                  <span>
                    You have <strong className="text-slate-900 font-bold">{todayTasks.length} task{todayTasks.length > 1 ? 's' : ''} today</strong>
                    {overdueCount > 0 ? (
                      <> and <strong className="text-red-600 font-bold">{overdueCount} is overdue</strong>.</>
                    ) : (
                      <>. Ready to get started?</>
                    )}
                  </span>
                </p>
              )}
            </div>

            {/* ══════════════════════════════════════════════════════════
                4. TODAY SECTION (Large 56px+ thumb-friendly rows)
                ══════════════════════════════════════════════════════════ */}
            <section className="space-y-3">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <h2 className="text-base font-extrabold text-slate-900">Today</h2>
                  <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200">
                    {todayTasks.length}
                  </span>
                </div>
                {overdueCount > 0 && (
                  <span className="text-[11px] font-bold text-red-600 bg-red-50 border border-red-200 px-2 py-0.5 rounded-full">
                    {overdueCount} Overdue
                  </span>
                )}
              </div>

              {todayTasks.length > 0 ? (
                <div className="clean-card divide-y divide-slate-100 overflow-hidden shadow-xs">
                  {todayTasks.map(task => {
                    const isOverdue = task.overdue;
                    return (
                      <div
                        key={task.id}
                        onClick={() => {
                          setActiveTask(task);
                          setShowBlockerInput(false);
                          setProofPhotoPreview(task.proofPhoto);
                        }}
                        className={`task-row p-4 flex items-center justify-between gap-3 cursor-pointer hover:bg-slate-50/80 ${
                          isOverdue ? 'border-l-4 border-l-red-500 bg-red-50/20' : ''
                        }`}
                      >
                        {/* Checkbox + Title block */}
                        <div className="flex items-center gap-3.5 min-w-0">
                          <button
                            type="button"
                            onClick={(e) => handleToggleComplete(task.id, e)}
                            className="w-6 h-6 rounded-full border-2 border-slate-300 hover:border-emerald-600 hover:bg-emerald-50 flex items-center justify-center flex-shrink-0 transition-colors group/chk focus:outline-none"
                            aria-label={`Mark ${task.title} as done`}
                          >
                            <svg className="w-3.5 h-3.5 text-emerald-600 opacity-0 group-hover/chk:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" />
                            </svg>
                          </button>

                          <div className="min-w-0">
                            <p className="text-xs sm:text-sm font-bold text-slate-900 leading-snug truncate">
                              {task.title}
                            </p>
                            <div className="flex items-center gap-2 text-[11px] text-slate-500 mt-0.5">
                              <span>{task.eventName} · {task.vertical}</span>
                              {task.status === 'blocked' && (
                                <span className="text-[10px] font-black px-1.5 py-0.2 rounded bg-red-100 text-red-800">
                                  Blocked
                                </span>
                              )}
                            </div>
                          </div>
                        </div>

                        {/* Due Time / Overdue pill */}
                        <div className="flex-shrink-0 text-right">
                          <span className={`text-[11px] font-extrabold px-2.5 py-1 rounded-lg border whitespace-nowrap ${
                            isOverdue
                              ? 'bg-red-50 text-red-700 border-red-200'
                              : 'bg-slate-50 text-slate-700 border-slate-200'
                          }`}>
                            {task.dueTimeStr}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div className="clean-card p-6 text-center text-slate-500 space-y-1">
                  <p className="text-sm font-bold text-slate-800">Nothing due today.</p>
                  <p className="text-xs">Enjoy the break or check your upcoming shifts below. 🎉</p>
                </div>
              )}
            </section>

            {/* ══════════════════════════════════════════════════════════
                5. TO DO SECTION (Upcoming, Segmented Control)
                ══════════════════════════════════════════════════════════ */}
            <section className="space-y-3 pt-2">
              <div className="flex items-center justify-between">
                <h2 className="text-base font-extrabold text-slate-900">To Do</h2>

                {/* Segmented Control */}
                <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-bold">
                  <button
                    onClick={() => setTodoFilter('week')}
                    className={`px-3 py-1 rounded-lg transition-all ${
                      todoFilter === 'week' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-black'
                    }`}
                  >
                    This week
                  </button>
                  <button
                    onClick={() => setTodoFilter('later')}
                    className={`px-3 py-1 rounded-lg transition-all ${
                      todoFilter === 'later' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-black'
                    }`}
                  >
                    Later
                  </button>
                  <button
                    onClick={() => setTodoFilter('all')}
                    className={`px-3 py-1 rounded-lg transition-all ${
                      todoFilter === 'all' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-black'
                    }`}
                  >
                    All ({tasks.filter(t => t.group !== 'today').length})
                  </button>
                </div>
              </div>

              {upcomingTasks.length > 0 ? (
                <div className="clean-card divide-y divide-slate-100 overflow-hidden shadow-xs">
                  {upcomingTasks.map(task => (
                    <div
                      key={task.id}
                      onClick={() => {
                        setActiveTask(task);
                        setShowBlockerInput(false);
                        setProofPhotoPreview(task.proofPhoto);
                      }}
                      className="task-row p-4 flex items-center justify-between gap-3 cursor-pointer hover:bg-slate-50/80"
                    >
                      <div className="flex items-center gap-3.5 min-w-0">
                        <button
                          type="button"
                          onClick={(e) => handleToggleComplete(task.id, e)}
                          className="w-6 h-6 rounded-full border-2 border-slate-300 hover:border-emerald-600 hover:bg-emerald-50 flex items-center justify-center flex-shrink-0 transition-colors group/chk focus:outline-none"

              <div className="relative">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                </svg>
                <span className="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-indigo-600"></span>
              </div>
              <span className="text-[10px] font-bold">Broadcasts</span>
            </button>

            <button
              onClick={() => setCopilotOpen(true)}
              className="flex flex-col items-center gap-1 text-cyan-700 hover:text-cyan-900 py-1 ai-action-button"
            >
              <span className="text-base font-black leading-none">✦</span>
              <span className="text-[10px] font-bold">Ask AI</span>
            </button>
          </nav>

          {/* ══════════════════════════════════════════════════════════
              TOAST POPUP
              ══════════════════════════════════════════════════════════ */}
          {toast && (
            <div className="fixed bottom-20 sm:bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none">
              <div className={`px-4 py-2.5 rounded-2xl text-xs font-bold text-white shadow-2xl flex items-center gap-2 ${
                toast.type === 'alert' ? 'bg-red-600' : 'bg-black'
              }`}>
                <span>{toast.msg}</span>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MyTasksApp />);
  </script>
</body>
</html>
